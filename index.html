<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حطبة — HATABA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{fontFamily:{taj:['Tajawal','sans-serif']},colors:{b:{bg:'#0A0A0A',bg2:'#111111',card:'#161616',card2:'#1C1C1C',border:'#262626',border2:'#333',gold:'#D4A853',goldH:'#E0B865',goldDim:'rgba(212,168,83,0.12)',txt:'#F0EBE0',txt2:'#A39E93',muted:'#6B665C',ok:'#5CB870',err:'#D95550'}}}}}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--safe-b:env(safe-area-inset-bottom,0px)}
html,body{height:100%;overflow:hidden;font-family:'Tajawal',sans-serif;background:#0A0A0A;color:#F0EBE0}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
.screen{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .4s ease,transform .4s ease;transform:translateY(12px);display:flex;flex-direction:column}
.screen.active{opacity:1;pointer-events:all;transform:translateY(0)}
#landing{background:#0A0A0A;justify-content:center;align-items:center;overflow:hidden}
.landing-bg{position:absolute;inset:0;z-index:0}
.landing-bg img{width:100%;height:100%;object-fit:cover;opacity:.25;filter:saturate(.7)}
.landing-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.3) 0%,rgba(10,10,10,.7) 50%,#0A0A0A 100%)}
.landing-content{position:relative;z-index:1;text-align:center;padding:2rem 1.5rem}
.landing-logo{font-size:clamp(3.5rem,12vw,7rem);font-weight:900;letter-spacing:.08em;line-height:1;background:linear-gradient(135deg,#F0EBE0 30%,#D4A853 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:logoIn 1s ease-out both}
.landing-tag{font-size:clamp(1rem,3vw,1.35rem);color:#A39E93;font-weight:300;margin-top:.5rem;animation:fadeUp 1s .3s ease-out both}
.landing-ctas{margin-top:2.5rem;display:flex;flex-direction:column;gap:.75rem;align-items:center;animation:fadeUp 1s .6s ease-out both}
.btn-primary{background:#D4A853;color:#0A0A0A;font-weight:700;font-size:1.1rem;padding:.9rem 2.5rem;border:none;border-radius:60px;cursor:pointer;transition:all .25s;width:100%;max-width:300px;font-family:inherit}
.btn-primary:hover{background:#E0B865;transform:scale(1.03)}
.btn-primary:active{transform:scale(.97)}
.btn-secondary{background:transparent;color:#A39E93;font-weight:500;font-size:.95rem;padding:.75rem 2rem;border:1px solid #333;border-radius:60px;cursor:pointer;transition:all .25s;width:100%;max-width:300px;font-family:inherit}
.btn-secondary:hover{border-color:#D4A853;color:#D4A853}
.landing-deco{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);z-index:1;color:#333;animation:bounce 2s infinite}
@keyframes logoIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.chat-header{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid #1C1C1C;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-shrink:0;z-index:5}
.chat-header .back-btn{background:none;border:none;color:#A39E93;font-size:1.2rem;cursor:pointer;padding:.3rem;transition:color .2s}
.chat-header .back-btn:hover{color:#F0EBE0}
.ai-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#D4A853,#B8903A);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;color:#0A0A0A;flex-shrink:0}
.ai-name{font-weight:700;font-size:.95rem;display:block;line-height:1.3}
.ai-status{font-size:.7rem;color:#5CB870;display:flex;align-items:center;gap:4px}
.ai-status::before{content:'';width:6px;height:6px;border-radius:50%;background:#5CB870;display:inline-block}
.chat-header .cart-btn{margin-right:auto;background:none;border:none;color:#A39E93;font-size:1.15rem;cursor:pointer;position:relative;padding:.4rem;transition:color .2s}
.chat-header .cart-btn:hover{color:#D4A853}
.cart-badge{position:absolute;top:-2px;right:-6px;background:#D4A853;color:#0A0A0A;font-size:.6rem;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .3s}
.cart-badge.pop{animation:popBadge .4s ease}
@keyframes popBadge{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}
.chat-messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem;scroll-behavior:smooth}
.msg{max-width:85%;animation:msgIn .35s ease-out both}
.msg-ai{align-self:flex-start}
.msg-user{align-self:flex-end}
.msg-bubble{padding:.7rem 1rem;border-radius:18px;font-size:.92rem;line-height:1.65;white-space:pre-wrap}
.msg-ai .msg-bubble{background:#161616;border:1px solid #222;border-bottom-right-radius:4px;color:#F0EBE0}
.msg-user .msg-bubble{background:#D4A853;color:#0A0A0A;border-bottom-left-radius:4px;font-weight:500}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.typing-indicator{display:flex;gap:4px;padding:.7rem 1rem;align-self:flex-start}
.typing-indicator span{width:7px;height:7px;background:#444;border-radius:50%;animation:typeDot 1.2s infinite}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typeDot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.product-card{background:#161616;border:1px solid #262626;border-radius:16px;overflow:hidden;margin-top:.5rem;max-width:320px;width:100%;cursor:default;transition:border-color .2s}
.product-card:hover{border-color:#333}
.pc-img{width:100%;height:160px;object-fit:cover;background:#111}
.pc-body{padding:.85rem 1rem}
.pc-name-ar{font-weight:800;font-size:1.05rem;margin-bottom:.15rem}
.pc-name-en{font-size:.72rem;color:#6B665C;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
.pc-ingredients{font-size:.78rem;color:#A39E93;line-height:1.5;margin-bottom:.6rem}
.pc-footer{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.pc-price{font-weight:800;font-size:1.15rem;color:#D4A853}
.pc-price span{font-size:.75rem;font-weight:400;color:#6B665C}
.pc-actions{display:flex;gap:.4rem}
.pc-btn{padding:.45rem .85rem;border-radius:20px;font-size:.78rem;font-weight:600;border:none;cursor:pointer;transition:all .2s;font-family:inherit}
.pc-btn-add{background:#D4A853;color:#0A0A0A}
.pc-btn-add:hover{background:#E0B865}
.pc-btn-alt{background:transparent;color:#A39E93;border:1px solid #333}
.pc-btn-alt:hover{border-color:#D4A853;color:#D4A853}
.pc-badge{display:inline-block;padding:.15rem .5rem;border-radius:8px;font-size:.65rem;font-weight:700;margin-bottom:.4rem}
.pc-badge.new{background:rgba(212,168,83,.15);color:#D4A853}
.pc-badge.bestseller{background:rgba(92,184,112,.15);color:#5CB870}
.quick-actions{flex-shrink:0;padding:.5rem 1rem .25rem;display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.quick-actions::-webkit-scrollbar{display:none}
.qa-chip{flex-shrink:0;padding:.5rem 1rem;border-radius:20px;font-size:.8rem;font-weight:500;border:1px solid #262626;background:#111;color:#A39E93;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
.qa-chip:hover{border-color:#D4A853;color:#D4A853;background:rgba(212,168,83,.06)}
.qa-chip:active{transform:scale(.95)}
.chat-input-area{flex-shrink:0;display:flex;gap:.5rem;padding:.6rem 1rem calc(.6rem + var(--safe-b));border-top:1px solid #1C1C1C;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chat-input-area input{flex:1;background:#161616;border:1px solid #262626;border-radius:24px;padding:.65rem 1.1rem;color:#F0EBE0;font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s}
.chat-input-area input::placeholder{color:#444}
.chat-input-area input:focus{border-color:#D4A853}
.send-btn{width:42px;height:42px;border-radius:50%;background:#D4A853;border:none;color:#0A0A0A;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.send-btn:hover{background:#E0B865;transform:scale(1.05)}
.send-btn:active{transform:scale(.93)}
.menu-header{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid #1C1C1C;background:rgba(10,10,10,.95);flex-shrink:0}
.menu-header h2{font-weight:800;font-size:1.1rem;flex:1}
.menu-cats{display:flex;gap:.5rem;padding:.75rem 1rem;overflow-x:auto;scrollbar-width:none;flex-shrink:0;background:#0D0D0D}
.menu-cats::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;padding:.5rem 1.1rem;border-radius:20px;font-size:.8rem;font-weight:600;border:1px solid #262626;background:transparent;color:#6B665C;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
.cat-tab.active{background:#D4A853;color:#0A0A0A;border-color:#D4A853}
.cat-tab:not(.active):hover{border-color:#444;color:#A39E93}
.menu-grid{flex:1;overflow-y:auto;padding:.5rem 1rem 2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.75rem;align-content:start}
.menu-item{background:#161616;border:1px solid #1E1E1E;border-radius:14px;overflow:hidden;transition:all .25s;animation:menuItemIn .4s ease-out both}
.menu-item:hover{border-color:#333;transform:translateY(-2px)}
@keyframes menuItemIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.mi-img{width:100%;height:140px;object-fit:cover;background:#111}
.mi-no-img{width:100%;height:100px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#111,#1A1A1A);color:#333;font-size:2rem}
.mi-body{padding:.75rem}
.mi-top{display:flex;justify-content:space-between;align-items:start;gap:.5rem;margin-bottom:.25rem}
.mi-name{font-weight:700;font-size:.95rem;line-height:1.3}
.mi-price{font-weight:800;color:#D4A853;font-size:.95rem;white-space:nowrap}
.mi-ingredients{font-size:.75rem;color:#6B665C;line-height:1.5;margin-bottom:.5rem}
.mi-add{width:100%;padding:.5rem;border-radius:10px;background:rgba(212,168,83,.1);border:1px solid rgba(212,168,83,.2);color:#D4A853;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.mi-add:hover{background:rgba(212,168,83,.2)}
.mi-add:active{transform:scale(.97)}
.mi-badges{display:flex;gap:.3rem;margin-bottom:.3rem}
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
.cart-overlay.open{opacity:1;pointer-events:all}
.cart-panel{position:fixed;top:0;left:0;bottom:0;width:min(400px,90vw);background:#111;z-index:51;transform:translateX(-100%);transition:transform .35s ease;display:flex;flex-direction:column;border-right:1px solid #1C1C1C}
.cart-panel.open{transform:translateX(0)}
.cart-panel-header{display:flex;align-items:center;justify-content:space-between;padding:1rem;border-bottom:1px solid #1C1C1C;flex-shrink:0}
.cart-panel-header h2{font-weight:800;font-size:1.05rem}
.cart-close{background:none;border:none;color:#6B665C;font-size:1.3rem;cursor:pointer;transition:color .2s}
.cart-close:hover{color:#F0EBE0}
.cart-items{flex:1;overflow-y:auto;padding:.75rem}
.cart-empty{text-align:center;color:#444;padding:3rem 1rem;font-size:.9rem}
.ci-item{display:flex;gap:.75rem;padding:.65rem 0;border-bottom:1px solid #1A1A1A;align-items:center}
.ci-img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#1A1A1A;flex-shrink:0}
.ci-no-img{width:52px;height:52px;border-radius:10px;background:#1A1A1A;display:flex;align-items:center;justify-content:center;color:#333;font-size:1.1rem;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-weight:600;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-price{font-size:.8rem;color:#D4A853;font-weight:600}
.ci-qty{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.ci-qty button{width:26px;height:26px;border-radius:50%;border:1px solid #333;background:transparent;color:#A39E93;font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ci-qty button:hover{border-color:#D4A853;color:#D4A853}
.ci-qty span{font-weight:600;font-size:.85rem;min-width:18px;text-align:center}
.ci-remove{background:none;border:none;color:#444;font-size:.8rem;cursor:pointer;padding:.3rem;transition:color .2s}
.ci-remove:hover{color:#D95550}
.cart-footer{padding:1rem;border-top:1px solid #1C1C1C;flex-shrink:0;padding-bottom:calc(1rem + var(--safe-b))}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.cart-total-label{color:#A39E93;font-size:.9rem}
.cart-total-val{font-weight:800;font-size:1.2rem;color:#D4A853}
.checkout-btn{width:100%;padding:.8rem;border-radius:14px;background:#D4A853;color:#0A0A0A;font-weight:700;font-size:1rem;border:none;cursor:pointer;transition:all .2s;font-family:inherit}
.checkout-btn:hover{background:#E0B865}
.checkout-btn:disabled{opacity:.4;cursor:not-allowed}
.checkout-screen{background:#0A0A0A}
.checkout-body{flex:1;overflow-y:auto;padding:1rem}
.checkout-body h2{font-weight:800;font-size:1.15rem;margin-bottom:1rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.82rem;color:#A39E93;margin-bottom:.35rem;font-weight:500}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:.7rem 1rem;background:#161616;border:1px solid #262626;border-radius:12px;color:#F0EBE0;font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:#D4A853}
.form-group textarea{resize:none;height:70px}
.form-group select option{background:#161616}
.delivery-toggle{display:flex;gap:.5rem;margin-bottom:1rem}
.dt-btn{flex:1;padding:.65rem;border-radius:12px;border:1px solid #262626;background:transparent;color:#A39E93;font-weight:600;font-size:.85rem;cursor:pointer;transition:all .2s;font-family:inherit}
.dt-btn.active{background:#D4A853;color:#0A0A0A;border-color:#D4A853}
.order-summary-box{background:#161616;border:1px solid #222;border-radius:14px;padding:1rem;margin-top:1rem;margin-bottom:1rem}
.osb-title{font-weight:700;font-size:.85rem;margin-bottom:.5rem;color:#A39E93}
.osb-item{display:flex;justify-content:space-between;font-size:.85rem;padding:.3rem 0;color:#F0EBE0}
.osb-item span:last-child{color:#A39E93}
.osb-total{display:flex;justify-content:space-between;font-size:.95rem;padding:.5rem 0 0;border-top:1px solid #262626;margin-top:.4rem;font-weight:800}
.osb-total span:last-child{color:#D4A853}
.success-screen{background:#0A0A0A;justify-content:center;align-items:center;text-align:center;padding:2rem}
.success-icon{width:80px;height:80px;border-radius:50%;background:rgba(92,184,112,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:2rem;color:#5CB870;animation:successPop .6s ease-out both}
@keyframes successPop{from{transform:scale(0);opacity:0}60%{transform:scale(1.15)}to{transform:scale(1);opacity:1}}
.success-screen h2{font-weight:800;font-size:1.4rem;margin-bottom:.5rem}
.success-screen p{color:#A39E93;font-size:.95rem;margin-bottom:2rem;max-width:300px}
.toast-container{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none}
.toast{padding:.6rem 1.2rem;border-radius:12px;font-size:.82rem;font-weight:600;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateY(0)}
.toast-ok{background:#1a2e1f;color:#5CB870;border:1px solid #2a4a32}
.toast-err{background:#2e1a1a;color:#D95550;border:1px solid #4a2a2a}
.mode-tag{font-size:.6rem;padding:.1rem .4rem;border-radius:6px;background:rgba(212,168,83,.1);color:#D4A853;margin-right:.3rem;vertical-align:middle}
@media(min-width:640px){.menu-grid{grid-template-columns:repeat(2,1fr);padding:1rem 1.5rem 2rem}.msg{max-width:65%}.product-card{max-width:360px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="landing" class="screen active">
  <div class="landing-bg">
    <img src="https://dozqwcczhaiqvoqcrrep.supabase.co/storage/v1/object/public/shop-product-images/93ab1515-a590-415e-8511-215fe775187d/edit-1787267093864.png" alt="" onerror="this.style.display='none'">
    <div></div>
  </div>
  <div class="landing-content">
    <div class="landing-logo">HATABA</div>
    <p class="landing-tag">نعرف البرقر.. ونعرفك</p>
    <div class="landing-ctas">
      <button class="btn-primary" onclick="openChat()">خلنا نختار لك</button>
      <button class="btn-secondary" onclick="openMenu()">أبي أشوف المنيو</button>
    </div>
  </div>
  <div class="landing-deco"><i class="fas fa-chevron-down"></i></div>
</div>

<div id="chat" class="screen">
  <div class="chat-header">
    <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-right"></i></button>
    <div class="ai-avatar">ح</div>
    <div><span class="ai-name">حطبة</span><span class="ai-status" id="aiStatusText">متصل</span></div>
    <button class="cart-btn" onclick="toggleCart()"><i class="fas fa-bag-shopping"></i><span class="cart-badge" id="chat-badge" style="display:none">0</span></button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="quick-actions" id="quickActions"></div>
  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="اكتب رسالتك..." autocomplete="off">
    <button class="send-btn" onclick="sendMessage()"><i class="fas fa-arrow-left"></i></button>
  </div>
</div>

<div id="menu" class="screen">
  <div class="menu-header">
    <button class="back-btn" onclick="goHome()" style="background:none;border:none;color:#A39E93;font-size:1.2rem;cursor:pointer;padding:.3rem"><i class="fas fa-arrow-right"></i></button>
    <h2>المنيو</h2>
    <button onclick="toggleCart()" style="margin-right:auto;background:none;border:none;color:#A39E93;font-size:1.15rem;cursor:pointer;position:relative;padding:.4rem"><i class="fas fa-bag-shopping"></i><span class="cart-badge" id="menu-badge" style="display:none">0</span></button>
  </div>
  <div class="menu-cats" id="menuCats"></div>
  <div class="menu-grid" id="menuGrid"></div>
</div>

<div id="checkout" class="screen checkout-screen">
  <div class="menu-header">
    <button class="back-btn" onclick="closeCartPanel()" style="background:none;border:none;color:#A39E93;font-size:1.2rem;cursor:pointer;padding:.3rem"><i class="fas fa-arrow-right"></i></button>
    <h2>إتمام الطلب</h2>
    <div style="width:32px"></div>
  </div>
  <div class="checkout-body" id="checkoutBody"></div>
</div>

<div id="success" class="screen success-screen">
  <div class="success-icon"><i class="fas fa-check"></i></div>
  <h2>تم تسجيل طلبك</h2>
  <p>رح نوصل لك الطلب في أقرب وقت. شكراً لثقتك بحطبة.</p>
  <button class="btn-primary" onclick="goHome()" style="max-width:240px">الرئيسية</button>
</div>

<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-panel-header"><h2>سلة الطلبات</h2><button class="cart-close" onclick="toggleCart()"><i class="fas fa-xmark"></i></button></div>
  <div class="cart-items" id="cartItems"></div>

/* ══════════════════════════════════════════

class HatabaAI{
  constructor(){this.reset()}
  reset(){
    this.prefs={budget:null,protein:null,flavor:null,truffle:false,spicy:false,hunger:null,people:1,goal:null,mealType:null,calorieConscious:false};
    this.asked=new Set();
    this.lastRecommendation=null;
    this.messageCount=0;
    this.awaitingAddResponse=null;
    this.detectedGender=null; // 'male' | 'female' | null
    this.detectedName=null;
    this.mood=null; // 'playful' | 'sad' | 'angry' | 'hurried' | 'chatty' | null
  }

  /* ═══════ المعالجة الرئيسية ═══════ */
  process(msg){
    this.messageCount++;
    const m=msg.trim();
    if(!m)return null;

    // لو ينتظر رد على إضافة
    if(this.awaitingAddResponse){
      const r=this.awaitingAddResponse;
      this.awaitingAddResponse=null;
      if(this.isYes(m))return r.onYes;
      if(this.isNo(m))return r.onNo;
    }

    // 1) كشف الجنس والاسم (قبل أي شيء)
    this.detectGenderName(m);

    // 2) تحليل المزاج
    this.detectMood(m);

    // 3) تحيات وأحوال — نرد طبيعي ثم نرجع للأكل
    const greeting=this.handleGreeting(m);
    if(greeting)return greeting;

    // 4) مزح — نرد بالمزح ثم نرجع
    const joke=this.handleJoke(m);
    if(joke)return joke;

    // 5) مشاعر سلبية
    const sad=this.handleEmotion(m);
    if(sad)return sad;

    // 6) مواضيع خارجية بذكاء
    if(this.isOffTopic(m))return this.respOffTopic();

    // 7) شكوى سعر
    if(this.isPriceComplaint(m))return this.respPriceComplaint();

    // 8) استخراج الكيانات
    this.extractEntities(m);

    // 9) طلب منتج بالاسم
    const named=this.findProduct(m);
    if(named&&this.messageCount<=3){
      const g=this.detectedGender==='female'?'اختيار حلو':'اختيار ممتاز';
      return{text:`${g}، ${named.nameAr} سعرها ${named.price} ريال.\nتبغى تضيفها للطلب؟`,products:[named],quickActions:['أضف للطلب','أبي أشوف خيارات ثانية']};
    }

    // 10) طلبات نوعية
    if(this.hasAny(m,['ترافل','truffle'])){this.prefs.truffle=true;return this.respTruffle()}
    if(this.hasAny(m,['أكثر مبيع','أعلى مبيع','الأكثر مبيعا','best seller','الأفضل','شعبي']))return this.respBestSeller();
    if(this.hasAny(m,['جديد','جديدين','مستجد','حديث']))return this.respNew();
    if(this.hasAny(m,['حار','حاره','حري','سبايسي','حريق','نار'])){this.prefs.spicy=true;return this.respSpicy()}
    if(this.hasAny(m,['فرايز','بطاطس']))return this.respFries();
    if(this.hasAny(m,['منيو','المنيو']))return{text:'تمام، تقدر تشوف المنيو من فوق. أو قولي وش تبغى وأنا ألخص لك.',quickActions:this.getQA()};
    if(this.hasAny(m,['سلة','السلة','طلباتي']))return{text:'تقدر تفتح السلة من أيقونة الشنطة فوق.',quickActions:this.getQA()};
    if(this.hasAny(m,['سعرات','كالوري','دايت','حمية','صحي','أخف','خفيف من المكونات'])){this.prefs.calorieConscious=true;return{text:'ما عندي معلومات السعرات الحرارية حالياً، لكن أقدر أساعدك تختار شيء أخف من ناحية المكونات.\nمثلاً حطبه تشيكن أخف من حطبه بيف.',quickActions:['أبي حطبه تشيكن','عادي ما يهم']};}
    if(this.hasAny(m,['شكرا','شكراً','مشكور','يعطيك العافية','الله يجزاك','ممتاز','حلوة']))return{text:this.detectedGender==='female'?'العفو حبيبتي 😊 تبغى شيء ثاني؟':this.detectedGender==='male'?'العفو يا صاحبي 👍 تبغى شيء ثاني؟':'العفو 👍 تبغى شيء ثاني؟',quickActions:['أبي شيء ثاني','لا خلاص']};

    // 11) عدد أشخاص
    const ppl=m.match(/نحن\s*(\d+)|(\d+)\s*(أشخاص|اشخاص|شخص|نفر)/);
    if(ppl){this.prefs.people=parseInt(ppl[1]||ppl[2]);return{text:`تمام، ${this.prefs.people} أشخاص.\nتحبون كل واحد يختار برقره ولا تبغون تشكيلة نتشاركها؟`,quickActions:['كل واحد يختار','تشكيلة نتشاركها']}}

    // 12) توصية أم سؤال
    if(this.shouldRecommend())return this.recommend();
    return this.askNext();
  }

  /* ═══════ كشف الجنس والاسم ═══════ */
  detectGenderName(m){
    if(this.detectedGender)return;
    const femaleNames=['فاطمة','سارة','نورة','هند','مريم','ليلى','ريم','لينا','دانة','غادة','عائشة','خلود','منال','رغد','جوهرة','لمياء','شيخة','مها','أمل','هيفاء','لمياء','عبير','نجلاء','هيا','جدان','رنا','حنين','أسماء','ملاك','جنات','فريدة','وعد','لوجين','تعويض','عنود','شهد','روز','لميس','بسمة','غدير','نوف','مليكة','صفية','شيماء','إيمان','نوف','آية','مريم','آمال','ثريا','هبه','يسرى','ميس','رزان','تالا','جوري'];
    const maleNames=['محمد','عبدالله','فهد','سعود','خالد','ناصر','بندر','تركي','ماضي','فيصل','عبدالرحمن','سلطان','أحمد','عمر','يوسف','إبراهيم','علي','حسن','سامي','ماجد','وليد','زياد','طلال','مشعل','حمد','منصور','راشد','حمزة','يزيد','عبدالعزيز','سلمى','بدر','عتيب','حبيب','أنس','آدم','ياسر','نواف','عبدالملك','زياد','صقر','مبارك','جاسر','هاني','وليد','سلطان','رائد','عمار','أسامة','سيف','عبدالإله'];

    for(const n of femaleNames){if(m.includes(n)){this.detectedGender='female';this.detectedName=n;return}}
    for(const n of maleNames){if(m.includes(n)){this.detectedGender='male';this.detectedName=n;return}}

    // كلمات تدل على أنثى
    if(this.hasAny(m,['أنا بنت','أنا وحدة','أبغى شي حلو','يما','ياما','حبيبتي']))this.detectedGender='female';
    // كلمات تدل على ذكر
    if(this.hasAny(m,['أنا ولد','أنا شاب','يا صاحبي','يا عم','يا غالي']))this.detectedGender='male';
  }

  /* ═══════ كشف المزاج ═══════ */
  detectMood(m){
    if(this.hasAny(m,['ههه','هههه','لول','😂','🤣','💀','امزح','امزح معك','مزحة']))this.mood='playful';
    else if(this.hasAny(m,['زعلان','زعلانة','حزين','متضايق','مقهور','كسلان','تعبان']))this.mood='sad';
    else if(this.hasAny(m,['غاضب','يقهر','سخف','غبي','فاشل']))this.mood='angry';
    else if(this.hasAny(m,['مستعجل','سريع','بسرعة','ضغط وقت','ما عندي وقت']))this.mood='hurried';
  }

  /* ═══════ التحيات ═══════ */
  handleGreeting(m){
    const greetings=['كيف حالك','كيفك','كيفحالك','شخبارك','شلونك','شخبار','وش أخبارك','اهلا','أهلا','هلا','السلام عليكم','مساء الخير','صباح الخير','هلا والله','هلا والله','حياك','حيالله','ايش اخبارك','عساك بخير','وش مسوي'];
    const isGreeting=greetings.some(g=>m.includes(g))||(m.length<=5&&!this.hasAny(m,['بيف','تشيكن','برقر','فرايز','ترافل','ريال','ميزانية']));

    if(!isGreeting)return null;

    const g=this.detectedGender;
    let response='';

    if(g==='female'){
      const opts=[
        'الحمد لله بخير، والأهم كيفك؟ 😊\nوش تبغى تأكل اليوم نشدحلك شي يسرّك',
        'أهلاً فيكِ، بخير الحمد لله. كيف حالك؟\nخلني أختار لك وجبة حلوة',
        'هلا حبيبتي، الحمد لله بخير. وش تبغين اليوم؟',
      ];
      response=opts[Math.floor(Math.random()*opts.length)];
    }else if(g==='male'){
      const opts=[
        'الحمد لله بخير، والأهم كيف أنت يا '+this.detectedName+'؟\nوش تبغى تأكل اليوم',
        'هلا والله، بخير الحمد لله. كيف حالك يا صاحبي؟\nخلني أضبط لك طلبك',
        'حياك الله، الحمد لله تمام. وش مسوي تبغى تأكل؟',
      ];
      response=opts[Math.floor(Math.random()*opts.length)];
    }else{
      const opts=[
        'الحمد لله بخير، والأهم كيف أنت؟\nوش تبغى تأكل اليوم نشدحلك',
        'هلا، بخير الحمد لله. كيف حالك؟\nخلني أختار لك وجبة تريحك',
        'أهلاً وسهلاً، الحمد لله بخير. وش تبغى اليوم؟',
      ];
      response=opts[Math.floor(Math.random()*opts.length)];
    }

    return{text:response,quickActions:['اختار لي 🍔','معي 25 ريال','أبي الأكثر مبيعاً','أبي ترافل']};
  }

  /* ═══════ المزح ═══════ */
  handleJoke(m){
    if(this.mood!=='playful')return null;

    // إذا هو اللي بدأ يمزح
    const jokeStarters=['امزح معك','محتكر نكتة','عندك نكتة','اكتبلي نكتة','ضحكني','شيء مضحك'];
    if(jokeStarters.some(j=>m.includes(j))){
      const jokes=[
        'هههه أنا اختصاصي البرقر مو النكت 😄\nلكن أقدر أضحكك بوجبة حطبه بيف، جربها وتشوف',
        'النكتة الوحيدة اللي أعرفها إن بعض الناس يطلب برقر بدون صوص حطبه 😂\nهذا غريب صح؟',

  /* ═══════ مشاعر ═══════ */
  handleEmotion(m){

      if(g==='male')return{text:'يا صاحبي زعلك في مكانه، لكن البرقر يحل نصف المشاكل 👍\nوش تبغى؟ أختار لك شيء يرضيك',quickActions:['أبي بيف','أبي شيء مشبع','معي 30 ريال']};
      return{text:'زعلك في مكانه، لكن وجبة حطبة تخفف كثير.\nوش تبغى؟ خلني أختار لك شي يريحك',quickActions:['أبي شيء حلو','أبي الأكثر مبيعاً']};

  /* ═══════ كشف خارج النطاق ═══════ */
  isOffTopic(m){
    if(m.length>50)return false;
    const o=['سيارة','سيارات','مباراة','كرة','فريق','انتخابات','سياسة','برمجة','كود','مدرسة','جامعة','طب','دكتور','علاج','دواء','طقس','سهم','أسهم','تداول','بنك','قرض','وظيفة','سفر','طيران','فندق','زواج','دين','فتوى','قرآن','صلاة','مسجد','ويكند','مول','سينما','فيلم','مسلسل','أنمي','لعبة','بلايستيشن','اكس بوكس'];
    return o.some(k=>m.includes(k));
  }

  respOffTopic(){
    const g=this.detectedGender;
    if(g==='female'){
      const opts=[
        'هههه هذا مو مجالي 😄 أنا اختصاصي البرقر. خلني أختار لك شي يلذذك',
        'يا حبيبتي هذا سؤال يحتاج خبير ثاني 😊 أنا هوني في البرقر. وش تبغين تاكلين؟',
      ];

    }
    if(g==='male'){
      const opts=[
        'هههه يا '+this.detectedName+' هذا مو تخصصي 😄 أنا خبيري في البرقر. خلني أضبط طلبك',
        'يا صاحبي السؤال بعيد 😄 أنا هنا عشان أخلصك من الجوع. وش تبغى تأكل؟',
      ];

    const opts=[
      'هههه سؤال بعيد عن البرقر 😄 أنا شغلي أخليك تطلع من حطبة مبسوط. خلنا نضبط طلبك.',
      'خلنا نخلي المواضيع الثانية على جنب 😄 أنا هنا عشان أساعدك تختار طلبك.',
    ];
    return{text:opts[Math.floor(Math.random()*opts.length)],quickActions:this.getQA()};
  }

  /* ═══════ استخراج الكيانات ═══════ */
  extractEntities(m){
    const bp=[/معي\s*(؟)?\s*(\d+)/,/ميزانيتي?\s*(؟)?\s*(\d+)/,/بـ?\s*(\d+)\s*ريال/,/(\d+)\s*ريال/,/حد\s*(؟)?\s*(\d+)/,/أقصى\s*(؟)?\s*(\d+)/,/ما\s*[أا]بغى\s*[أا]خرج\s*عن\s*(\d+)/,/ما\s*[أا]بي\s*[أا]طلع\s*عن\s*(\d+)/,/مابي\s*اخرج\s*عن\s*(\d+)/];
    for(const p of bp){const x=m.match(p);if(x){this.prefs.budget=parseInt(x[x.length-1]);break}}
    if(/^\d+$/.test(m.trim())&&!this.prefs.budget)this.prefs.budget=parseInt(m.trim());
    if(this.hasAny(m,['بيف','لحم','beef']))this.prefs.protein='beef';
    if(this.hasAny(m,['تشيكن','دجاج','chicken']))this.prefs.protein='chicken';
    if(this.hasAny(m,['مشبع','شبعان','جوعان','ويان','أبي أكل كثير','جوع']))this.prefs.hunger='high';
    if(this.hasAny(m,['خفيف','قليل','سناك','وجبة خفيفة','ما أبي كثير','شيء بسيط']))this.prefs.hunger='low';
    if(this.hasAny(m,['يستاهل','قيمة','أفضل قيمة','وفر','مقابل سعر']))this.prefs.goal='best_value';
    if(this.hasAny(m,['مهما كان السعر','الممتاز','الفخم','الاحترافي','الأفضل بلا حدود']))this.prefs.goal='best_experience';
    if(this.hasAny(m,['أجرب','شيء جديد','تجربة جديدة','ما جربت','أبي أجرب']))this.prefs.goal='try_new';
    if(this.hasAny(m,['كلاسيك','عادي','بسيط','معتاد','العادة','مألوف']))this.prefs.flavor='classic';
    if(this.hasAny(m,['مختلف','تجربة','مميز','خاص','يجنن','قوي النكهة','نكهة قوية']))this.prefs.flavor='adventurous';
    if(this.hasAny(m,['ترافل','truffle']))this.prefs.truffle=true;
    if(this.hasAny(m,['برقر','برجر','ساندويش','ساندوتش']))this.prefs.mealType='burger';
    if(this.hasAny(m,['وجبة','كمبو','سيت','meal','كامل']))this.prefs.mealType='full_meal';
  }

  /* ═══════ هل نوصّي؟ ═══════ */
  shouldRecommend(){
    const p=this.prefs;
    if(p.budget&&p.protein)return true;
    if(p.budget&&p.goal)return true;
    if(p.protein&&p.flavor)return true;
    if(p.protein&&p.truffle)return true;
    if(p.budget&&this.messageCount>=3)return true;
    if(p.protein&&p.hunger==='high')return true;
    return false;
  }

  /* ═══════ السؤال التالي ═══════ */
  askNext(){
    const p=this.prefs;const g=this.detectedGender;
    if(!p.protein&&!p.truffle&&!p.spicy&&!p.goal){
      if(g==='female')return{text:'خلني أفهم ذوقك شوي.\nأنتي اليوم ناوية على برقر ولا شيء خفيف؟',quickActions:['برقر','شيء خفيف','أبي الأكثر مبيعاً']};
      if(g==='male')return{text:'خلني أضبطها لك.\nأنت اليوم داخل على برقر ولا شيء خفيف؟',quickActions:['برقر','شيء خفيف','أبي الأكثر مبيعاً']};
      return{text:'خلني أضبطها لك.\nأنت اليوم داخل على برقر ولا شيء خفيف؟',quickActions:['برقر','شيء خفيف','أبي الأكثر مبيعاً']};
    }
    if(!p.protein&&!p.truffle){
      return{text:'بيف ولا تشيكن؟',quickActions:['بيف','تشيكن','لا يهم']};
    }
    if(!p.flavor&&!p.truffle&&!p.goal){
      return{text:'تحب النكهة الكلاسيكية ولا ودك نجرب شيء مختلف؟',quickActions:['كلاسيكية','شيء مختلف','أبي ترافل']};
    }
    if(!p.budget){
      if(g==='female')return{text:'ميزانيتك تقريباً كم؟ عشان أختار لك الأحسن.',quickActions:['معي 20 ريال','معي 25 ريال','معي 30 ريال','أبي أفضل شيء']};
      return{text:'ميزانيتك تقريباً كم؟ عشان أضبط لك الخيارات.',quickActions:['معي 20 ريال','معي 25 ريال','معي 30 ريال','أبي أفضل شيء مهما كان السعر']};
    }
    return this.recommend();
  }

  /* ═══════ التوصية ═══════ */
  recommend(){
    const p=this.prefs;let candidates=[];
    if(p.budget)candidates=this.buildCombos(p.budget);
    else candidates=this.filterScore(MENU.filter(i=>i.type==='burger'),p);
    if(!candidates.length)return{text:'ما لقيت شيء يناسب اللي تبغاه بهالميزانية. تبغى تزيد الميزانية شوي؟',quickActions:['زود 5 ريال','أبي أشوف المنيو']};
    const top=candidates.slice(0,2);
    const mains=[...new Map(top.map(c=>[c.items[0].id,c.items[0]])).values()];
    let reason=this.buildReason(top[0],p);
    let text='';
    const g=this.detectedGender;
    if(mains.length===1&&top[0].items.length===1){
      text=g==='female'?`أعتقد هذي أقرب شيء لذوقك 👇\n${reason}`:`أعتقد هذا أقرب شيء لذوقك 👇\n${reason}`;
    }else if(top[0].items.length>1){
      text=`عندك وجبة كاملة ضمن ميزانيتك 👇\n${reason}`;
    }else{
      text=`عندك خيارين حلوين:\n${reason}`;
    }
    this.lastRecommendation=top;
    const qa=['أشوف خيارات ثانية'];
    if(top[0].items.length===1&&p.budget&&top[0].total<p.budget){
      const rem=p.budget-top[0].total;
      if(rem>=7)qa.unshift('أضيف له فرايز');
      else if(rem>=3)qa.unshift('أضيف له صوص');
    }
    return{text,products:mains,quickActions:qa};
  }

  /* ═══════ بناء كمبات ═══════ */
  buildCombos(budget){
    const p=this.prefs;
    const burgers=MENU.filter(i=>i.type==='burger');
    const sides=MENU.filter(i=>i.type==='side'&&i.category!=='sauces');
    const drinks=MENU.filter(i=>i.type==='drink');
    const combos=[];
    for(const b of burgers){
      if(b.price>budget)continue;
      combos.push({items:[b],total:b.price,score:this.scoreItem(b,p)});
      const rem=budget-b.price;
      for(const s of sides){
        if(s.price<=rem){
          combos.push({items:[b,s],total:b.price+s.price,score:this.scoreItem(b,p)+this.scoreItem(s,p)*.5+10});
          const r2=rem-s.price;
          for(const d of drinks){if(d.price<=r2)combos.push({items:[b,s,d],total:b.price+s.price+d.price,score:this.scoreItem(b,p)+this.scoreItem(s,p)*.5+this.scoreItem(d,p)*.2+20})}
        }
      }
      for(const d of drinks){if(d.price<=rem)combos.push({items:[b,d],total:b.price+d.price,score:this.scoreItem(b,p)+this.scoreItem(d,p)*.2+5})}
    }
    combos.sort((a,b)=>{
      const au=a.total/budget,bu=b.total/budget;
      const ab=au>=.8&&au<=1?15:au>=.6?5:-10;
      const bb=bu>=.8&&bu<=1?15:bu>=.6?5:-10;
      return(b.score+bb)-(a.score+ab);
    });
    const seen=new Set();
    return combos.filter(c=>{const k=c.items.map(i=>i.id).sort().join(',');if(seen.has(k))return false;seen.add(k);return true}).slice(0,4);
  }

  scoreItem(item,p){
    let s=0;
    if(p.protein&&item.protein===p.protein)s+=15;
    if(p.protein&&item.protein&&item.protein!==p.protein)s-=20;
    if(p.truffle&&item.tags.includes('truffle'))s+=15;
    if(p.spicy&&item.tags.includes('spicy'))s+=12;
    if(p.flavor==='classic'&&item.tags.includes('classic'))s+=10;
    if(p.flavor==='adventurous'&&(item.tags.includes('truffle')||item.tags.includes('loaded')))s+=12;
    if(p.goal==='best_value'&&item.bestSeller)s+=8;
    if(p.goal==='best_experience'&&item.tags.includes('truffle'))s+=10;
    if(p.goal==='try_new'&&item.isNew)s+=12;
    if(item.bestSeller)s+=4;
    if(item.isNew)s+=2;
    return s;
  }

  filterScore(items,p){return items.map(i=>({items:[i],total:i.price,score:this.scoreItem(i,p)})).filter(c=>c.score>0).sort((a,b)=>b.score-a.score)}

  buildReason(combo,p){
    const m=combo.items[0];const r=[];
    if(p.truffle&&m.tags.includes('truffle'))r.push('لأنك تحب الترافل');
    if(p.protein==='beef'&&m.protein==='beef')r.push('بيف كما تبغى');
    if(p.protein==='chicken'&&m.protein==='chicken')r.push('تشيكن كما تبغى');
    if(p.flavor==='classic')r.push('نكهة كلاسيكية');
    if(p.flavor==='adventurous')r.push('نكهة مميزة ومختلفة');
    if(p.goal==='best_value')r.push('أفضل قيمة مقابل السعر');
    if(p.goal==='best_experience')r.push('أفضل تجربة');
    if(p.goal==='try_new')r.push('من المنتجات الجديدة');
    if(m.bestSeller&&!r.length)r.push('الأكثر مبيعاً عندنا');
    if(combo.items.length>1)r.push(`وجبة كاملة بـ${combo.total} ريال`);
    else r.push(`سعرها ${m.price} ريال`);
    return r.join('، ');
  }

  /* ═══════ ردود نوعية ═══════ */
  respTruffle(){
    const t=MENU.filter(i=>i.tags.includes('truffle'));
    const g=this.detectedGender;
    if(this.prefs.budget){
      const w=t.filter(i=>i.price<=this.prefs.budget);
      if(w.length){
        const intro=g==='female'?'ذوقك حلو 👏 هذي خيارات الترافل 👇':g==='male'?'ذوقك ممتاز 👏 هذي خيارات الترافل 👇':'ذوقك ممتاز 👏 هذي خيارات الترافل 👇';
        return{text:intro,products:w,quickActions:['أشوف خيارات ثانية']};
      }
    }
    const intro=g==='female'?'ذوقك حلو 👏 عندنا خيارات ترافل. ميزانيتك تقريباً كم؟':g==='male'?'ذوقك ممتاز 👏 عندنا خيارات ترافل. ميزانيتك تقريباً كم؟':'ذوقك ممتاز 👏 عندنا خيارات ترافل. ميزانيتك تقريباً كم؟';
    return{text:intro,products:t,quickActions:['معي 25 ريال','معي 30 ريال','أبي أفضل شيء']};
  }

  respBestSeller(){
    const b=MENU.filter(i=>i.bestSeller&&i.type==='burger');
    this.prefs.goal='best_value';
    return{text:'هذي الأكثر مبيعاً عندنا 👇',products:b,quickActions:['أبي شيء مختلف','أبي فرايز معه']};
  }

  respNew(){
    const n=MENU.filter(i=>i.isNew);this.prefs.goal='try_new';
    return{text:'هذي آخر شيء أضفناه 👇',products:n,quickActions:['أبي الأكثر مبيعاً']};
  }

  respSpicy(){
    return{text:'عندنا صوص سبايسي ممتاز، تقدر تضيفه لأي برقر ويصير شي ثاني.\nتبغى تختار برقر أولاً؟',quickActions:['بيف','تشيكن','أبي الأكثر مبيعاً']};
  }

  respFries(){
    const f=MENU.filter(i=>i.category==='fries');
    return{text:'هذي خيارات الفرايز 👇',products:f,quickActions:['أبي برقر مع فرايز','رجع للبرقرات']};
  }

  respPriceComplaint(){
    this.prefs.budget=null;
    const g=this.detectedGender;
    if(g==='female')return{text:'معك حق حبيبتي، خلنا ننزلها شوي. كم حاب يكون الحد الأعلى؟',quickActions:['15 ريال','20 ريال','25 ريال']};
    return{text:'معك حق، خلنا ننزلها شوي. كم حاب يكون الحد الأعلى؟',quickActions:['15 ريال','20 ريال','25 ريال']};
  }

  /* ═══════ إضافة منتج ═══════ */
  onProductAdded(pid){
    const p=MENU.find(i=>i.id===pid);if(!p)return null;
    const rem=this.prefs.budget?this.prefs.budget-p.price:null;
    if(rem&&rem>=7){
      const f=MENU.find(i=>i.id==='french-fries');
      this.awaitingAddResponse={
        onYes:{text:`تمام، أضفنا الفرنش فرايز. طلبك الآن ${p.price+f.price} ريال 👍`,quickActions:['أتمم الطلب','أبي شيء ثاني']},
        onNo:{text:'تمام، طلبك جاهز 👍',quickActions:['أتمم الطلب','أبي شيء ثاني']}
      };
      return{text:`حلو، أضفناه لك.\nباقي لك ${rem} ريال من ميزانيتك. لو تبغى تكملها، الفرنش فرايز بـ${f.price} ريال وتكون وجبتك كاملة.`,quickActions:['أيوا أضفها','لا خلاص']};
    }
    if(rem&&rem>=3){
      const s=MENU.find(i=>i.id==='s-hataba');
      this.awaitingAddResponse={
        onYes:{text:`تمام، أضفنا صوص حطبه 👍`,quickActions:['أتمم الطلب','أبي شيء ثاني']},
        onNo:{text:'تمام 👍',quickActions:['أتمم الطلب','أبي شيء ثاني']}
      };
      return{text:`حلو، أضفناه 👍\nباقي لك ${rem} ريال. تقدر تضيف صوص حطبه بـ${s.price} ريال يرفع النكهة.`,quickActions:['أيوا أضفه','لا خلاص']};
    }
    return{text:'تمام، أضفناه 👍',quickActions:['أتمم الطلب','أبي شيء ثاني']};
  }

  /* ═══════ أدوات ═══════ */
  hasAny(m,kw){return kw.some(k=>m.includes(k))}
  isPriceComplaint(m){return this.hasAny(m,['غالي','سعره عالي','مكلف','أغلى','ما يستاهل','مبالغ فيه'])}
  isYes(m){return this.hasAny(m,['ايوا','نعم','أيوا','تمام','حلو','زين','ok','أكيد','طبعا','هلا','نعم','هيه','ايوه'])}
  isNo(m){return this.hasAny(m,['لا','لاا','أبدا','ما أبي','ما أبغى','خلاص','لا يهم','لا لا'])}
  findProduct(m){return MENU.find(i=>m.includes(i.nameAr)||m.toLowerCase().includes(i.nameEn.toLowerCase()))}
  getQA(){
    const p=this.prefs,b=[];
    if(!p.protein)b.push('بيف','تشيكن');
    if(!p.truffle)b.push('أبي ترافل');
    if(!p.budget)b.push('معي 25 ريال');
    b.push('أبي الأكثر مبيعاً','أبي شيء مشبع');
    return b.slice(0,6);
  }
}

function addAIMessage(text,products=[]){
  const c=document.getElementById('chatMessages');const d=document.createElement('div');d.className='msg msg-ai';
  let h=`<div class="msg-bubble">${esc(text)}</div>`;
  if(products.length)h+=products.map(p=>renderPC(p)).join('');
  d.innerHTML=h;c.appendChild(d);scrollBottom();
}
function addUserMessage(text){
  const c=document.getElementById('chatMessages');const d=document.createElement('div');d.className='msg msg-user';
  d.innerHTML=`<div class="msg-bubble">${esc(text)}</div>`;c.appendChild(d);scrollBottom();
}
function showTyping(){
  const c=document.getElementById('chatMessages');const d=document.createElement('div');d.className='typing-indicator';d.id='typingInd';
  d.innerHTML='<span></span><span></span><span></span>';c.appendChild(d);scrollBottom();
}
function hideTyping(){const e=document.getElementById('typingInd');if(e)e.remove()}

function renderPC(p){
  let badges='';if(p.isNew)badges+='<span class="pc-badge new">جديد</span>';if(p.bestSeller)badges+='<span class="pc-badge bestseller">الأكثر مبيعاً</span>';
  const img=p.image?`<img class="pc-img" src="${p.image}" alt="${p.nameAr}" onerror="this.outerHTML='<div class=\\'pc-img\\' style=\\'display:flex;align-items:center;justify-content:center;background:#111;color:#333;font-size:1.5rem\\'><i class=\\'fas fa-burger\\'></i></div>'">`:`<div class="pc-img" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#111,#1A1A1A);color:#333;font-size:1.5rem"><i class="fas fa-burger"></i></div>`;
  return`<div class="product-card">${img}<div class="pc-body">${badges}<div class="pc-name-ar">${p.nameAr}</div><div class="pc-name-en">${p.nameEn}</div><div class="pc-ingredients">${p.ingredients.join(' • ')}</div><div class="pc-footer"><div class="pc-price">${p.price} <span>ر.س</span></div><div class="pc-actions"><button class="pc-btn pc-btn-add" onclick="addFromChat('${p.id}')">أضف للطلب</button><button class="pc-btn pc-btn-alt" onclick="sendQuickAction('أشوف خيارات ثانية')">ثانية</button></div></div></div></div>`;
}

function renderQuickActions(actions){
  const c=document.getElementById('quickActions');
  c.innerHTML=actions.map(a=>`<button class="qa-chip" onclick="sendQuickAction('${a.replace(/'/g,"\\'")}')">${a}</button>`).join('');
}
function scrollBottom(){const c=document.getElementById('chatMessages');setTimeout(()=>c.scrollTop=c.scrollHeight,50)}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ══════════════════════════════════════════
   إرسال الرسائل — API أولاً ثم Fallback
   ══════════════════════════════════════════ */
function sendMessage(){const i=document.getElementById('chatInput');const t=i.value.trim();if(!t)return;i.value='';processUserMsg(t)}
function sendQuickAction(t){processUserMsg(t)}

async function processUserMsg(text){
  addUserMessage(text);
  conversationHistory.push({role:'user',text});
  renderQuickActions([]);
  showTyping();

  // نحاول Gemini أولاً
  if(apiAvailable){
    try{
      const res=await callGeminiAPI(text);
      hideTyping();
      const products=(res.showProducts||[]).map(id=>MENU.find(i=>i.id===id)).filter(Boolean);
      addAIMessage(res.text,products);
      renderQuickActions(res.quickActions||[]);
      conversationHistory.push({role:'model',text:res.text});
      // نحدث التفضيلات المحلية بناءً على الاستجابة (للفولباك)
      updateLocalPrefs(text);
      return;
    }catch(e){
      console.log('API فشل، ننتقل للمحرك المحلي:',e.message);
      apiAvailable=false;
      document.getElementById('aiStatusText').textContent='محلي';
    }
  }

  // Fallback: المحرك المحلي
  const delay=600+Math.random()*600;
  setTimeout(()=>{
    hideTyping();
    const resp=ai.process(text);
    if(!resp)return;
    addAIMessage(resp.text,resp.products||[]);
    renderQuickActions(resp.quickActions||[]);
    conversationHistory.push({role:'model',text:resp.text});
  },delay);
}

function updateLocalPrefs(text){ai.extractEntities(text)}

async function callGeminiAPI(message){
  const res=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      message,
      history:conversationHistory.slice(-14),
      preferences:ai.prefs
    })
  });
  if(!res.ok)throw new Error(`HTTP ${res.status}`);
  const data=await res.json();
  if(data.error)throw new Error(data.error);
  return data;
}

function addFromChat(pid){
  addToCart(pid);
  // نرسل للـ API لو متاح
  if(apiAvailable){
    const product=MENU.find(i=>i.id===pid);
    const addMsg=`أضفت ${product.nameAr} للسلة`;
    addUserMessage(addMsg);
    conversationHistory.push({role:'user',text:addMsg});
    showTyping();
    callGeminiAPI(addMsg).then(res=>{
      hideTyping();
      const products=(res.showProducts||[]).map(id=>MENU.find(i=>i.id===id)).filter(Boolean);
      addAIMessage(res.text,products);
      renderQuickActions(res.quickActions||[]);
      conversationHistory.push({role:'model',text:res.text});
    }).catch(()=>{
      hideTyping();
      const resp=ai.onProductAdded(pid);
      if(resp){addAIMessage(resp.text,resp.products||[]);renderQuickActions(resp.quickActions||[]);conversationHistory.push({role:'model',text:resp.text})}
    });
  }else{
    const resp=ai.onProductAdded(pid);
    if(resp){showTyping();setTimeout(()=>{hideTyping();addAIMessage(resp.text,resp.products||[]);renderQuickActions(resp.quickActions||[]);conversationHistory.push({role:'model',text:resp.text})},500)}
  }
}

document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});

/* ══════════════════════════════════════════
   المنيو
   ══════════════════════════════════════════ */
function renderMenu(){
  document.getElementById('menuCats').innerHTML=CATEGORIES.map(c=>`<button class="cat-tab ${c.id===activeCategory?'active':''}" onclick="switchCat('${c.id}')">${c.nameAr}</button>`).join('');
  renderMenuItems();
}
function switchCat(id){activeCategory=id;document.querySelectorAll('.cat-tab').forEach(t=>t.classList.toggle('active',t.textContent===CATEGORIES.find(c=>c.id===id).nameAr));renderMenuItems()}
function renderMenuItems(){
  const g=document.getElementById('menuGrid');const items=MENU.filter(i=>i.category===activeCategory);
  g.innerHTML=items.map((item,idx)=>{
    let badges='';if(item.isNew)badges+='<span class="pc-badge new">جديد</span>';if(item.bestSeller)badges+='<span class="pc-badge bestseller">الأكثر مبيعاً</span>';
    const img=item.image?`<img class="mi-img" src="${item.image}" alt="${item.nameAr}" onerror="this.outerHTML='<div class=\\'mi-no-img\\'><i class=\\'fas fa-burger\\'></i></div>'">`:`<div class="mi-no-img"><i class="fas fa-${getIcon(item.category)}"></i></div>`;
    return`<div class="menu-item" style="animation-delay:${idx*.07}s">${img}<div class="mi-body"><div class="mi-badges">${badges}</div><div class="mi-top"><div class="mi-name">${item.nameAr}</div><div class="mi-price">${item.price} ر.س</div></div><div class="mi-ingredients">${item.nameEn}${item.ingredients.length?' • '+item.ingredients.join(', '):''}</div><button class="mi-add" onclick="addToCart('${item.id}')"><i class="fas fa-plus" style="margin-left:.3rem"></i> أضف للسلة</button></div></div>`;
  }).join('');
}
function getIcon(c){return{new:'star',beef:'fire',chicken:'drumstick-bite',fries:'bowl-food',appetizers:'utensils',sauces:'droplet',additions:'circle-plus',drinks:'glass-water'}[c]||'circle'}

/* ══════════════════════════════════════════
   السلة
   ══════════════════════════════════════════ */
function addToCart(pid){const p=MENU.find(i=>i.id===pid);if(!p)return;const e=cart.find(i=>i.id===pid);if(e)e.qty++;else cart.push({...p,qty:1});updateCartUI();showToast(`تمت إضافة ${p.nameAr}`)}
function removeFromCart(pid){cart=cart.filter(i=>i.id!==pid);updateCartUI();renderCartItems()}
function changeQty(pid,d){const i=cart.find(x=>x.id===pid);if(!i)return;i.qty+=d;if(i.qty<=0){removeFromCart(pid);return}updateCartUI();renderCartItems()}
function getCartTotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0)}
function getCartCount(){return cart.reduce((s,i)=>s+i.qty,0)}
function updateCartUI(){
  const count=getCartCount();const total=getCartTotal();
  ['chat-badge','menu-badge'].forEach(id=>{const b=document.getElementById(id);if(count>0){b.style.display='flex';b.textContent=count;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}else b.style.display='none'});
  document.getElementById('cartTotal').textContent=total+' ر.س';
  document.getElementById('cartCheckoutBtn').disabled=count===0;
  renderCartItems();
}
function renderCartItems(){
  const c=document.getElementById('cartItems');
  if(!cart.length){c.innerHTML='<div class="cart-empty"><i class="fas fa-bag-shopping" style="font-size:2rem;display:block;margin-bottom:.75rem"></i>السلة فاضية</div>';return}
  c.innerHTML=cart.map(i=>{
    const img=i.image?`<img class="ci-img" src="${i.image}" alt="" onerror="this.outerHTML='<div class=\\'ci-no-img\\'><i class=\\'fas fa-burger\\'></i></div>'">`:`<div class="ci-no-img"><i class="fas fa-${getIcon(i.category)}"></i></div>`;
    return`<div class="ci-item">${img}<div class="ci-info"><div class="ci-name">${i.nameAr}</div><div class="ci-price">${i.price*i.qty} ر.س</div></div><div class="ci-qty"><button onclick="changeQty('${i.id}',-1)"><i class="fas fa-minus" style="font-size:.6rem"></i></button><span>${i.qty}</span><button onclick="changeQty('${i.id}',1)"><i class="fas fa-plus" style="font-size:.6rem"></i></button></div><button class="ci-remove" onclick="removeFromCart('${i.id}')"><i class="fas fa-trash-can"></i></button></div>`;
  }).join('');
}
function toggleCart(){const o=document.getElementById('cartOverlay'),p=document.getElementById('cartPanel');if(p.classList.contains('open')){o.classList.remove('open');p.classList.remove('open')}else{renderCartItems();o.classList.add('open');p.classList.add('open')}}
function closeCartPanel(){document.getElementById('cartOverlay').classList.remove('open');document.getElementById('cartPanel').classList.remove('open')}

/* ══════════════════════════════════════════
   تسجيل الطلب
   ══════════════════════════════════════════ */
function goToCheckout(){if(!cart.length)return;closeCartPanel();showScreen('checkout');renderCheckout()}
function renderCheckout(){
  const b=document.getElementById('checkoutBody');const t=getCartTotal();
  b.innerHTML=`<h2>بيانات التوصيل</h2><div class="delivery-toggle"><button class="dt-btn ${deliveryType==='delivery'?'active':''}" onclick="setDT('delivery')"><i class="fas fa-motorcycle" style="margin-left:.3rem"></i>توصيل</button><button class="dt-btn ${deliveryType==='pickup'?'active':''}" onclick="setDT('pickup')"><i class="fas fa-store" style="margin-left:.3rem"></i>استلام</button></div><div id="deliveryFields"><div class="form-group"><label>الاسم</label><input type="text" id="cName" placeholder="اسمك الكامل"></div><div class="form-group"><label>رقم الجوال</label><input type="tel" id="cPhone" placeholder="05XXXXXXXX" dir="ltr" style="text-align:right"></div>${deliveryType==='delivery'?'<div class="form-group"><label>عنوان التوصيل</label><textarea id="cAddress" placeholder="الحي، الشارع، رقم المبنى"></textarea>':''}<div class="form-group"><label>ملاحظات (اختياري)</label><textarea id="cNotes" placeholder="أي طلبات خاصة"></textarea></div></div><div class="order-summary-box"><div class="osb-title">ملخص الطلب</div>${cart.map(i=>`<div class="osb-item"><span>${i.nameAr} × ${i.qty}</span><span>${i.price*i.qty} ر.س</span></div>`).join('')}<div class="osb-total"><span>المجموع</span><span>${t} ر.س</span></div></div><button class="checkout-btn" onclick="submitOrder()" style="margin-top:1rem">تأكيد الطلب — ${t} ر.س</button>`;
}
function setDT(t){deliveryType=t;renderCheckout()}
function submitOrder(){
  const name=document.getElementById('cName')?.value.trim();const phone=document.getElementById('cPhone')?.value.trim();
  if(!name){showToast('أدخل اسمك','err');return}if(!phone||phone.length<10){showToast('أدخل رقم جوال صحيح','err');return}
  if(deliveryType==='delivery'){const a=document.getElementById('cAddress')?.value.trim();if(!a){showToast('أدخل عنوان التوصيل','err');return}}
  cart=[];updateCartUI();showScreen('success');
}

/* ══════════════════════════════════════════
   توست
   ══════════════════════════════════════════ */
function showToast(msg,type='ok'){
  const c=document.getElementById('toastContainer');const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;c.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},2200);
}

updateCartUI();
</script>
</body>
