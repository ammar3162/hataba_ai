<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حطبة — HATABA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{fontFamily:{taj:['Tajawal','sans-serif']}}}}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--safe-b:env(safe-area-inset-bottom,0px);--bg:#080808;--bg2:#0F0F0F;--bg3:#161616;--bg4:#1C1C1C;--bg5:#242424;--border:#1E1E1E;--border2:#2A2A2A;--gold:#D4A853;--gold2:#E0B865;--gold3:#C49A42;--gold-bg:rgba(212,168,83,.08);--gold-bg2:rgba(212,168,83,.15);--txt:#F2EDE4;--txt2:#B0A99C;--txt3:#6E675C;--green:#5CB870;--red:#D95550}
html,body{height:100%;overflow:hidden;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--txt)}

/* ═══ الشاشات ═══ */
.screen{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1);transform:translateY(16px) scale(.99);display:flex;flex-direction:column}
.screen.active{opacity:1;pointer-events:all;transform:translateY(0) scale(1)}

/* ═══ لاندينغ ═══ */
#landing{background:var(--bg);justify-content:center;align-items:center;overflow:hidden}
.l-bg{position:absolute;inset:0;z-index:0}
.l-bg img{width:100%;height:100%;object-fit:cover;opacity:.2;filter:saturate(.6) contrast(1.1)}
.l-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,8,.2) 0%,rgba(8,8,8,.6) 40%,rgba(8,8,8,.95) 80%,var(--bg) 100%)}
.l-content{position:relative;z-index:1;text-align:center;padding:2rem 1.5rem}
.l-logo{font-size:clamp(4rem,14vw,8rem);font-weight:900;letter-spacing:.1em;line-height:.9;background:linear-gradient(160deg,#F2EDE4 20%,#D4A853 60%,#C49A42 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:lLogo 1.2s cubic-bezier(.4,0,.2,1) both;filter:drop-shadow(0 0 60px rgba(212,168,83,.15))}
.l-sub{font-size:clamp(.95rem,3vw,1.3rem);color:var(--txt2);font-weight:300;margin-top:.6rem;letter-spacing:.04em;animation:lUp 1s .35s cubic-bezier(.4,0,.2,1) both}
.l-line{width:40px;height:2px;background:var(--gold);margin:1.5rem auto 0;border-radius:2px;animation:lUp 1s .5s cubic-bezier(.4,0,.2,1) both}
.l-ctas{margin-top:2.5rem;display:flex;flex-direction:column;gap:.7rem;align-items:center;animation:lUp 1s .65s cubic-bezier(.4,0,.2,1) both}
.l-btn1{background:var(--gold);color:var(--bg);font-weight:700;font-size:1.05rem;padding:.85rem 2.8rem;border:none;border-radius:50px;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);width:100%;max-width:300px;font-family:inherit;box-shadow:0 4px 24px rgba(212,168,83,.25)}
.l-btn1:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(212,168,83,.35)}
.l-btn1:active{transform:translateY(0) scale(.97)}
.l-btn2{background:transparent;color:var(--txt3);font-weight:500;font-size:.9rem;padding:.7rem 2rem;border:1px solid var(--border2);border-radius:50px;cursor:pointer;transition:all .3s;width:100%;max-width:300px;font-family:inherit}
.l-btn2:hover{border-color:var(--gold3);color:var(--gold)}
.l-scroll{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:1;color:var(--txt3);font-size:.75rem;animation:lBounce 2.5s infinite ease-in-out}
@keyframes lLogo{from{opacity:0;transform:scale(.85) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes lUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes lBounce{0%,100%{transform:translateX(-50%) translateY(0);opacity:.5}50%{transform:translateX(-50%) translateY(-8px);opacity:1}}

/* ═══ هيدر الشات ═══ */
.ch-header{display:flex;align-items:center;gap:.7rem;padding:.6rem .85rem;background:rgba(8,8,8,.85);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--border);flex-shrink:0;z-index:5;position:relative}
.ch-header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(212,168,83,.15),transparent)}
.ch-back{background:none;border:none;color:var(--txt3);font-size:1.1rem;cursor:pointer;padding:.35rem .15rem;transition:color .2s;border-radius:8px}
.ch-back:hover{color:var(--txt)}
.ch-ai{display:flex;align-items:center;gap:.6rem;flex:1}
.ch-avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold3));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;color:var(--bg);flex-shrink:0;box-shadow:0 2px 12px rgba(212,168,83,.2)}
.ch-info{line-height:1.25}
.ch-name{font-weight:700;font-size:.88rem;display:block}
.ch-status{font-size:.65rem;color:var(--green);display:flex;align-items:center;gap:4px}
.ch-status::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 6px rgba(92,184,112,.5)}
.ch-cart{background:none;border:none;color:var(--txt3);font-size:1.05rem;cursor:pointer;position:relative;padding:.4rem;border-radius:10px;transition:all .2s}
.ch-cart:hover{color:var(--gold);background:var(--gold-bg)}
.ch-badge{position:absolute;top:0;right:0;background:var(--gold);color:var(--bg);font-size:.55rem;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.4,0,.2,1);padding:0 3px}
.ch-badge.pop{animation:bPop .45s cubic-bezier(.4,0,.2,1)}
@keyframes bPop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}

/* ═══ منطقة الرسائل ═══ */
.ch-messages{flex:1;overflow-y:auto;padding:.85rem .85rem .5rem;display:flex;flex-direction:column;gap:.15rem;scroll-behavior:smooth;position:relative;background:var(--bg)}
.ch-messages::before{content:'';position:fixed;top:50%;left:50%;width:300px;height:300px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(212,168,83,.02) 0%,transparent 70%);pointer-events:none;z-index:0}

/* ═══ فقاعة الرسالة ═══ */
.msg-wrap{display:flex;gap:.4rem;max-width:88%;animation:msgSlide .4s cubic-bezier(.4,0,.2,1) both;position:relative;z-index:1}
.msg-wrap.ai{align-self:flex-start}
.msg-wrap.user{align-self:flex-end;flex-direction:row-reverse}

.msg-av{width:28px;height:28px;border-radius:9px;flex-shrink:0;margin-top:auto;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800}
.msg-wrap.ai .msg-av{background:linear-gradient(135deg,var(--gold),var(--gold3));color:var(--bg)}
.msg-wrap.user .msg-av{background:var(--bg4);color:var(--txt3)}

.msg-bubble{padding:.65rem .9rem;border-radius:16px;font-size:.88rem;line-height:1.7;white-space:pre-wrap;position:relative}
.msg-wrap.ai .msg-bubble{background:var(--bg3);border:1px solid var(--border);border-top-right-radius:4px;color:var(--txt)}
.msg-wrap.user .msg-bubble{background:linear-gradient(135deg,var(--gold),var(--gold3));color:var(--bg);border-top-left-radius:4px;font-weight:500}

.msg-time{font-size:.58rem;color:var(--txt3);margin-top:.2rem;padding:0 .2rem;opacity:.6}
.msg-wrap.user .msg-time{text-align:left}

@keyframes msgSlide{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ═══ مؤشر الكتابة ═══ */
.typing{display:flex;gap:.4rem;align-self:flex-start;animation:msgSlide .3s ease both;position:relative;z-index:1}
.typing .msg-av{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold3));color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;flex-shrink:0}
.typing-dots{background:var(--bg3);border:1px solid var(--border);border-radius:16px;border-top-right-radius:4px;padding:.7rem 1rem;display:flex;gap:5px;align-items:center}
.typing-dots span{width:6px;height:6px;background:var(--txt3);border-radius:50%;animation:tDot 1.4s infinite ease-in-out}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes tDot{0%,60%,100%{opacity:.25;transform:scale(.8)}30%{opacity:1;transform:scale(1.1)}}

/* ═══ بطاقة منتج ═══ */
.p-card{background:var(--bg3);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-top:.45rem;max-width:300px;width:100%;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative}
.p-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.p-card-img{width:100%;height:150px;object-fit:cover;background:var(--bg2);position:relative}
.p-card-img-fallback{width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg2),var(--bg4));color:var(--border2);font-size:2.5rem}
.p-card-badges{position:absolute;top:.6rem;right:.6rem;display:flex;gap:.3rem}
.p-badge{padding:.2rem .55rem;border-radius:8px;font-size:.6rem;font-weight:700;backdrop-filter:blur(8px)}
.p-badge.new{background:rgba(212,168,83,.2);color:var(--gold);border:1px solid rgba(212,168,83,.25)}
.p-badge.best{background:rgba(92,184,112,.15);color:var(--green);border:1px solid rgba(92,184,112,.2)}
.p-card-body{padding:.8rem .9rem .9rem}
.p-card-name{font-weight:800;font-size:1rem;margin-bottom:.1rem}
.p-card-en{font-size:.65rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.p-card-ing{font-size:.75rem;color:var(--txt2);line-height:1.55;margin-bottom:.65rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-card-foot{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
.p-card-price{font-weight:900;font-size:1.2rem;color:var(--gold);letter-spacing:-.02em}
.p-card-price small{font-size:.7rem;font-weight:400;color:var(--txt3);margin-right:2px}
.p-card-btns{display:flex;gap:.35rem}
.p-btn{padding:.45rem .8rem;border-radius:12px;font-size:.75rem;font-weight:700;border:none;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);font-family:inherit}
.p-btn-add{background:var(--gold);color:var(--bg)}
.p-btn-add:hover{background:var(--gold2);transform:scale(1.04)}
.p-btn-add:active{transform:scale(.96)}
.p-btn-alt{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(212,168,83,.15)}
.p-btn-alt:hover{background:var(--gold-bg2)}

/* ═══ الأزرار السريعة ═══ */
.qa-bar{flex-shrink:0;padding:.4rem .85rem .2rem;display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;position:relative}
.qa-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.qa-bar::-webkit-scrollbar{display:none}
.qa-btn{flex-shrink:0;padding:.5rem .9rem;border-radius:22px;font-size:.78rem;font-weight:600;border:1px solid var(--border2);background:var(--bg2);color:var(--txt2);cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);font-family:inherit;white-space:nowrap;position:relative;overflow:hidden}
.qa-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(212,168,83,.08),transparent);opacity:0;transition:opacity .25s}
.qa-btn:hover{border-color:var(--gold3);color:var(--gold);transform:translateY(-1px);box-shadow:0 2px 12px rgba(212,168,83,.1)}
.qa-btn:hover::before{opacity:1}
.qa-btn:active{transform:translateY(0) scale(.96)}
.qa-btn.qa-gold{background:linear-gradient(135deg,var(--gold),var(--gold3));color:var(--bg);border-color:transparent;font-weight:700}
.qa-btn.qa-gold:hover{box-shadow:0 4px 20px rgba(212,168,83,.3);transform:translateY(-2px)}

/* ═══ حقل الإدخال ═══ */
.ch-input{flex-shrink:0;display:flex;gap:.45rem;padding:.5rem .85rem calc(.5rem + var(--safe-b));background:rgba(8,8,8,.9);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-top:1px solid var(--border);position:relative}
.ch-input::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(212,168,83,.1),transparent)}
.ch-input input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:.65rem 1rem;color:var(--txt);font-size:.88rem;font-family:inherit;outline:none;transition:all .25s}
.ch-input input::placeholder{color:var(--txt3);font-size:.82rem}
.ch-input input:focus{border-color:rgba(212,168,83,.4);box-shadow:0 0 0 3px rgba(212,168,83,.08)}
.ch-send{width:40px;height:40px;border-radius:14px;background:var(--gold);border:none;color:var(--bg);font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s cubic-bezier(.4,0,.2,1);flex-shrink:0}
.ch-send:hover{background:var(--gold2);transform:scale(1.06);box-shadow:0 4px 16px rgba(212,168,83,.3)}
.ch-send:active{transform:scale(.94)}

/* ═══ فاصل التاريخ ═══ */
.msg-date{align-self:center;font-size:.65rem;color:var(--txt3);background:var(--bg3);padding:.25rem .8rem;border-radius:10px;border:1px solid var(--border);margin:.4rem 0;animation:msgSlide .4s ease both}

/* ═══ منيو ═══ */
.mn-header{display:flex;align-items:center;gap:.75rem;padding:.7rem .85rem;background:rgba(8,8,8,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
.mn-header h2{font-weight:800;font-size:1.05rem;flex:1}
.mn-back{background:none;border:none;color:var(--txt3);font-size:1.1rem;cursor:pointer;padding:.3rem}
.mn-cats{display:flex;gap:.4rem;padding:.65rem .85rem;overflow-x:auto;scrollbar-width:none;flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border)}
.mn-cats::-webkit-scrollbar{display:none}
.mn-tab{flex-shrink:0;padding:.45rem 1rem;border-radius:18px;font-size:.78rem;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--txt3);cursor:pointer;transition:all .25s;font-family:inherit;white-space:nowrap}
.mn-tab.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700;box-shadow:0 2px 12px rgba(212,168,83,.2)}
.mn-tab:not(.on):hover{border-color:var(--border2);color:var(--txt2)}
.mn-grid{flex:1;overflow-y:auto;padding:.65rem .85rem 2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.65rem;align-content:start}
.mn-item{background:var(--bg3);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:all .3s cubic-bezier(.4,0,.2,1);animation:mnIn .45s ease-out both}
.mn-item:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
@keyframes mnIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.mn-img{width:100%;height:130px;object-fit:cover;background:var(--bg2)}
.mn-noimg{width:100%;height:90px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg2),var(--bg4));color:var(--border2);font-size:1.8rem}
.mn-body{padding:.7rem .8rem .8rem}
.mn-badges{display:flex;gap:.25rem;margin-bottom:.25rem}
.mn-top{display:flex;justify-content:space-between;align-items:start;gap:.4rem;margin-bottom:.2rem}
.mn-name{font-weight:700;font-size:.9rem;line-height:1.3}
.mn-price{font-weight:800;color:var(--gold);font-size:.9rem;white-space:nowrap}
.mn-ing{font-size:.72rem;color:var(--txt3);line-height:1.5;margin-bottom:.5rem}
.mn-add{width:100%;padding:.5rem;border-radius:12px;background:var(--gold-bg);border:1px solid rgba(212,168,83,.12);color:var(--gold);font-size:.78rem;font-weight:700;cursor:pointer;transition:all .25s;font-family:inherit}
.mn-add:hover{background:var(--gold-bg2);border-color:rgba(212,168,83,.25)}
.mn-add:active{transform:scale(.97)}

/* ═══ سلة ═══ */
.cart-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(4px)}
.cart-ov.open{opacity:1;pointer-events:all}
.cart-pn{position:fixed;top:0;left:0;bottom:0;width:min(380px,92vw);background:var(--bg2);z-index:51;transform:translateX(-100%);transition:transform .4s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;border-right:1px solid var(--border)}
.cart-pn.open{transform:translateX(0)}
.cart-hd{display:flex;align-items:center;justify-content:space-between;padding:.9rem;border-bottom:1px solid var(--border);flex-shrink:0}
.cart-hd h2{font-weight:800;font-size:1rem}
.cart-x{background:none;border:none;color:var(--txt3);font-size:1.2rem;cursor:pointer;padding:.3rem;border-radius:8px;transition:all .2s}
.cart-x:hover{color:var(--txt);background:var(--bg4)}
.cart-list{flex:1;overflow-y:auto;padding:.7rem}
.cart-empty{text-align:center;color:var(--txt3);padding:3rem 1rem;font-size:.85rem}
.cart-empty i{font-size:2rem;display:block;margin-bottom:.6rem;color:var(--border2)}
.ci{display:flex;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--border);align-items:center}
.ci-img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--bg3);flex-shrink:0}
.ci-noimg{width:48px;height:48px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--border2);font-size:1rem;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-weight:600;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-price{font-size:.78rem;color:var(--gold);font-weight:600}
.ci-qty{display:flex;align-items:center;gap:.3rem;flex-shrink:0}
.ci-qty button{width:24px;height:24px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--txt2);font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ci-qty button:hover{border-color:var(--gold);color:var(--gold)}
.ci-qty span{font-weight:700;font-size:.82rem;min-width:16px;text-align:center}
.ci-del{background:none;border:none;color:var(--txt3);font-size:.75rem;cursor:pointer;padding:.25rem;border-radius:6px;transition:all .2s}
.ci-del:hover{color:var(--red);background:rgba(217,85,80,.1)}
.cart-ft{padding:.9rem;border-top:1px solid var(--border);flex-shrink:0;padding-bottom:calc(.9rem + var(--safe-b));background:var(--bg2)}
.cart-tot{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem}
.cart-tot-l{color:var(--txt2);font-size:.85rem}
.cart-tot-v{font-weight:900;font-size:1.15rem;color:var(--gold)}
.cart-go{width:100%;padding:.75rem;border-radius:14px;background:var(--gold);color:var(--bg);font-weight:700;font-size:.95rem;border:none;cursor:pointer;transition:all .25s;font-family:inherit}
.cart-go:hover{background:var(--gold2);box-shadow:0 4px 20px rgba(212,168,83,.25)}
.cart-go:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

/* ═══ تسجيل الطلب ═══ */
.ck-body{flex:1;overflow-y:auto;padding:1rem .85rem}
.ck-body h2{font-weight:800;font-size:1.1rem;margin-bottom:1rem}
.fg{margin-bottom:.85rem}
.fg label{display:block;font-size:.78rem;color:var(--txt2);margin-bottom:.3rem;font-weight:500}
.fg input,.fg textarea,.fg select{width:100%;padding:.65rem .9rem;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--txt);font-size:.88rem;font-family:inherit;outline:none;transition:border-color .25s}
.fg input:focus,.fg textarea:focus{border-color:rgba(212,168,83,.4);box-shadow:0 0 0 3px rgba(212,168,83,.06)}
.fg textarea{resize:none;height:65px}
.dtog{display:flex;gap:.4rem;margin-bottom:1rem}
.dtog button{flex:1;padding:.6rem;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--txt3);font-weight:600;font-size:.82rem;cursor:pointer;transition:all .25s;font-family:inherit}
.dtog button.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}

extract(m){const bp=[/معي\s*(؟)?\s*(\d+)/,/ميزانيتي?\s*(؟)?\s*(\d+)/,/بـ?\s*(\d+)\s*ريال/,/(\d+)\s*ريال/,/حد\s*(؟)?\s*(\d+)/,/أقصى\s*(؟)?\s*(\d+)/,/ما\s*[أا]بغى\s*[أا]خرج\s*عن\s*(\d+)/];for(const p of bp){const x=m.match(p);if(x){this.p.budget=parseInt(x[x.length-1]);break}}if(/^\d+$/.test(m.trim())&&!this.p.budget)this.p.budget=parseInt(m.trim());if(this.any(m,['بيف','لحم','beef']))this.p.protein='beef';if(this.any(m,['تشيكن','دجاج','chicken']))this.p.protein='chicken';if(this.any(m,['مشبع','شبعان','جوعان','ويان','جوع']))this.p.hunger='high';if(this.any(m,['خفيف','قليل','سناك','وجبة خفيفة']))this.p.hunger='low';if(this.any(m,['يستاهل','قيمة','أفضل قيمة','وفر']))this.p.goal='best_value';if(this.any(m,['مهما كان السعر','الممتاز','الفخم','الاحترافي']))this.p.goal='best_experience';if(this.any(m,['أجرب','شيء جديد','تجربة جديدة','ما جربت']))this.p.goal='try_new';if(this.any(m,['كلاسيك','عادي','بسيط','معتاد']))this.p.flavor='classic';if(this.any(m,['مختلف','تجربة','مميز','خاص','يجنن','قوي النكهة']))this.p.flavor='adventurous';if(this.any(m,['ترافل','truffle']))this.p.truffle=true;if(this.any(m,['برقر','برجر','ساندويش']))this.p.mealType='burger'}

buildCombo(bud){const p=this.p;const bg=MENU.filter(i=>i.type==='burger'),sd=MENU.filter(i=>i.type==='side'&&i.category!=='sauces'),dr=MENU.filter(i=>i.type==='drink'),cb=[];for(const b of bg){if(b.price>bud)continue;cb.push({items:[b],total:b.price,sc:this.scI(b,p)});const rm=bud-b.price;for(const s of sd){if(s.price<=rm){cb.push({items:[b,s],total:b.price+s.price,sc:this.scI(b,p)+this.scI(s,p)*.5+10});const r2=rm-s.price;for(const d of dr){if(d.price<=r2)cb.push({items:[b,s,d],total:b.price+s.price+d.price,sc:this.scI(b,p)+this.scI(s,p)*.5+this.scI(d,p)*.2+20})}}}for(const d of dr){if(d.price<=rm)cb.push({items:[b,d],total:b.price+d.price,sc:this.scI(b,p)+this.scI(d,p)*.2+5})}}cb.sort((a,b)=>{const au=a.total/bud,bu=b.total/bud;return(b.sc+(bu>=.8&&bu<=1?15:bu>=.6?5:-10))-(a.sc+(au>=.8&&au<=1?15:au>=.6?5:-10))});const s=new Set;return cb.filter(c=>{const k=c.items.map(i=>i.id).sort().join(',');if(s.has(k))return false;s.add(k);return true}).slice(0,4)}

  const c=document.getElementById('msgs');
  const w=document.createElement('div');w.className='msg-wrap user';
  w.innerHTML=`<div class="msg-av"><i class="fas fa-user" style="font-size:.6rem"></i></div><div><div class="msg-bubble">${esc(text)}</div><div class="msg-time">${getTime()}</div></div>`;
  c.appendChild(w);scrollBot();
}
function showTyp(){
  const c=document.getElementById('msgs');const d=document.createElement('div');d.className='typing';d.id='typInd';
  d.innerHTML='<div class="msg-av">ح</div><div class="typing-dots"><span></span><span></span><span></span></div>';
  c.appendChild(d);scrollBot();
}
function hideTyp(){const e=document.getElementById('typInd');if(e)e.remove()}
function getTime(){const n=new Date();return n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')}
function scrollBot(){const c=document.getElementById('msgs');setTimeout(()=>c.scrollTop=c.scrollHeight,60)}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderPC(p){
  let badges='';if(p.isNew)badges+='<span class="p-badge new">جديد</span>';if(p.bestSeller)badges+='<span class="p-badge best">الأكثر مبيعاً</span>';
  const img=p.image?`<img class="p-card-img" src="${p.image}" alt="${p.nameAr}" onerror="this.outerHTML='<div class=\\'p-card-img-fallback\\'><i class=\\'fas fa-burger\\'></i></div>'">`:`<div class="p-card-img-fallback"><i class="fas fa-burger"></i></div>`;
  return`<div class="p-card">${img}<div class="p-card-badges">${badges}</div><div class="p-card-body"><div class="p-card-name">${p.nameAr}</div><div class="p-card-en">${p.nameEn}</div><div class="p-card-ing">${p.ingredients.join(' • ')}</div><div class="p-card-foot"><div class="p-card-price">${p.price} <small>ر.س</small></div><div class="p-card-btns"><button class="p-btn p-btn-add" onclick="addFromChat('${p.id}')">أضف للطلب</button><button class="p-btn p-btn-alt" onclick="sendQA('أشوف خيارات ثانية')">ثانية</button></div></div></div></div>`;
}

function renderQA(actions){
  const c=document.getElementById('qaBar');
  c.innerHTML=actions.map((a,i)=>{
    const isGold=i===0&&actions.length>2;
    return`<button class="qa-btn${isGold?' qa-gold':''}" onclick="sendQA('${a.replace(/'/g,"\\'")}')">${a}</button>`;
  }).join('');
}

/* ═══════════════════════════════════════
   إرسال الرسائل
   ═══════════════════════════════════════ */
function sendMsg(){const i=document.getElementById('chatIn');const t=i.value.trim();if(!t)return;i.value='';processMsg(t)}
function sendQA(t){processMsg(t)}

async function processMsg(text){
  addUser(text);
  convHist.push({role:'user',text});
  renderQA([]);
  showTyp();
  if(apiOK){
    try{
      const res=await callAPI(text);
      hideTyp();
      const products=(res.showProducts||[]).map(id=>MENU.find(i=>i.id===id)).filter(Boolean);
      addAI(res.text,products);
      renderQA(res.quickActions||[]);
      convHist.push({role:'model',text:res.text});
      ai.extract(text);return;
    }catch(e){console.log('API فشل:',e.message);apiOK=false;document.getElementById('aiSt').textContent='محلي'}
  }
  const delay=500+Math.random()*500;
  setTimeout(()=>{hideTyp();const r=ai.process(text);if(!r)return;addAI(r.text,r.products||[]);renderQA(r.qa||[]);convHist.push({role:'model',text:r.text})},delay);
}

async function callAPI(msg){
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,history:convHist.slice(-14),preferences:ai.p})});
  if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();if(d.error)throw new Error(d.error);return d;
}

function addFromChat(pid){
  addToCart(pid);
  if(apiOK){
    const p=MENU.find(i=>i.id===pid);const m=`أضفت ${p.nameAr} للسلة`;
    addUser(m);convHist.push({role:'user',text:m});showTyp();
    callAPI(m).then(r=>{hideTyp();const products=(r.showProducts||[]).map(id=>MENU.find(i=>i.id===id)).filter(Boolean);addAI(r.text,products);renderQA(r.quickActions||[]);convHist.push({role:'model',text:r.text})}).catch(()=>{hideTyp();const r=ai.onAdd(pid);if(r){addAI(r.text,r.products||[]);renderQA(r.qa||[]);convHist.push({role:'model',text:r.text})}});
  }else{const r=ai.onAdd(pid);if(r){showTyp();setTimeout(()=>{hideTyp();addAI(r.text,r.products||[]);renderQA(r.qa||[]);convHist.push({role:'model',text:r.text})},400)}}
}

document.getElementById('chatIn').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});

/* ═══════════════════════════════════════
   المنيو
   ═══════════════════════════════════════ */
function openMenu(){showScr('menu');renderMenu()}
function renderMenu(){
  document.getElementById('mnCats').innerHTML=CATS.map(c=>`<button class="mn-tab${c.id===activeCat?' on':''}" onclick="swCat('${c.id}')">${c.n}</button>`).join('');
  renderMItems();
}
function swCat(id){activeCat=id;document.querySelectorAll('.mn-tab').forEach(t=>t.classList.toggle('on',t.textContent===CATS.find(c=>c.id===id).n));renderMItems()}
function renderMItems(){
  const g=document.getElementById('mnGrid');const items=MENU.filter(i=>i.category===activeCat);
  g.innerHTML=items.map((item,idx)=>{
    let badges='';if(item.isNew)badges+='<span class="p-badge new">جديد</span>';if(item.bestSeller)badges+='<span class="p-badge best">الأكثر مبيعاً</span>';
    const img=item.image?`<img class="mn-img" src="${item.image}" alt="${item.nameAr}" onerror="this.outerHTML='<div class=\\'mn-noimg\\'><i class=\\'fas fa-burger\\'></i></div>'">`:`<div class="mn-noimg"><i class="fas fa-${{new:'star',beef:'fire',chicken:'drumstick-bite',fries:'bowl-food',appetizers:'utensils',sauces:'droplet',additions:'circle-plus',drinks:'glass-water'}[item.category]||'circle'}"></i></div>`;
    return`<div class="mn-item" style="animation-delay:${idx*.06}s">${img}<div class="mn-body"><div class="mn-badges">${badges}</div><div class="mn-top"><div class="mn-name">${item.nameAr}</div><div class="mn-price">${item.price} ر.س</div></div><div class="mn-ing">${item.nameEn}${item.ingredients.length?' • '+item.ingredients.join(', '):''}</div><button class="mn-add" onclick="addToCart('${item.id}')"><i class="fas fa-plus" style="margin-left:.25rem"></i>أضف للسلة</button></div></div>`;
  }).join('');
}

/* ═══════════════════════════════════════
   السلة
   ═══════════════════════════════════════ */
function addToCart(pid){const p=MENU.find(i=>i.id===pid);if(!p)return;const e=cart.find(i=>i.id===pid);if(e)e.qty++;else cart.push({...p,qty:1});updateCart();toast(`تمت إضافة ${p.nameAr}`)}
function remCart(pid){cart=cart.filter(i=>i.id!==pid);updateCart();renderCartList()}
function chgQty(pid,d){const i=cart.find(x=>x.id===pid);if(!i)return;i.qty+=d;if(i.qty<=0){remCart(pid);return}updateCart();renderCartList()}
function cartTot(){return cart.reduce((s,i)=>s+i.price*i.qty,0)}
function cartCnt(){return cart.reduce((s,i)=>s+i.qty,0)}
function updateCart(){
  const cnt=cartCnt(),tot=cartTot();
  ['cBadge1','cBadge2'].forEach(id=>{const b=document.getElementById(id);if(cnt>0){b.style.display='flex';b.textContent=cnt;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}else b.style.display='none'});
  document.getElementById('cartTot').textContent=tot+' ر.س';
  document.getElementById('cartGo').disabled=cnt===0;
  renderCartList();
}
function renderCartList(){
  const c=document.getElementById('cartList');
  if(!cart.length){c.innerHTML='<div class="cart-empty"><i class="fas fa-bag-shopping"></i>السلة فاضية</div>';return}
  c.innerHTML=cart.map(i=>{
    const img=i.image?`<img class="ci-img" src="${i.image}" alt="" onerror="this.outerHTML='<div class=\\'ci-noimg\\'><i class=\\'fas fa-burger\\'></i></div>'">`:`<div class="ci-noimg"><i class="fas fa-${{new:'star',beef:'fire',chicken:'drumstick-bite',fries:'bowl-food',appetizers:'utensils',sauces:'droplet',additions:'circle-plus',drinks:'glass-water'}[i.category]||'circle'}"></i></div>`;
    return`<div class="ci">${img}<div class="ci-info"><div class="ci-name">${i.nameAr}</div><div class="ci-price">${i.price*i.qty} ر.س</div></div><div class="ci-qty"><button onclick="chgQty('${i.id}',-1)"><i class="fas fa-minus" style="font-size:.55rem"></i></button><span>${i.qty}</span><button onclick="chgQty('${i.id}',1)"><i class="fas fa-plus" style="font-size:.55rem"></i></button></div><button class="ci-del" onclick="remCart('${i.id}')"><i class="fas fa-trash-can"></i></button></div>`;
  }).join('');
}
function toggleCart(){const o=document.getElementById('cartOv'),p=document.getElementById('cartPn');if(p.classList.contains('open')){o.classList.remove('open');p.classList.remove('open')}else{renderCartList();o.classList.add('open');p.classList.add('open')}}
function closeCart(){document.getElementById('cartOv').classList.remove('open');document.getElementById('cartPn').classList.remove('open')}

/* ═══════════════════════════════════════
   تسجيل الطلب
   ═══════════════════════════════════════ */
function goCheckout(){if(!cart.length)return;closeCart();showScr('checkout');renderCK()}
function renderCK(){
  const b=document.getElementById('ckBody');const t=cartTot();
  b.innerHTML=`<h2>بيانات التوصيل</h2><div class="dtog"><button class="${delType==='delivery'?'on':''}" onclick="setDT('delivery')"><i class="fas fa-motorcycle" style="margin-left:.25rem"></i>توصيل</button><button class="${delType==='pickup'?'on':''}" onclick="setDT('pickup')"><i class="fas fa-store" style="margin-left:.25rem"></i>استلام</button></div><div class="fg"><label>الاسم</label><input type="text" id="cN" placeholder="اسمك الكامل"></div><div class="fg"><label>رقم الجوال</label><input type="tel" id="cP" placeholder="05XXXXXXXX" dir="ltr" style="text-align:right"></div>${delType==='delivery'?'<div class="fg"><label>عنوان التوصيل</label><textarea id="cA" placeholder="الحي، الشارع، رقم المبنى"></textarea>':''}<div class="fg"><label>ملاحظات (اختياري)</label><textarea id="cNo" placeholder="أي طلبات خاصة"></textarea></div><div class="osb"><div class="osb-t">ملخص الطلب</div>${cart.map(i=>`<div class="osb-i"><span>${i.nameAr} × ${i.qty}</span><span>${i.price*i.qty} ر.س</span></div>`).join('')}<div class="osb-total"><span>المجموع</span><span>${t} ر.س</span></div></div><button class="ck-go" onclick="submitOrder()">تأكيد الطلب — ${t} ر.س</button>`;
}
function setDT(t){delType=t;renderCK()}
function submitOrder(){
  const n=document.getElementById('cN')?.value.trim();const p=document.getElementById('cP')?.value.trim();
  if(!n){toast('أدخل اسمك','err');return}if(!p||p.length<10){toast('أدخل رقم جوال صحيح','err');return}
  if(delType==='delivery'){const a=document.getElementById('cA')?.value.trim();if(!a){toast('أدخل عنوان التوصيل','err');return}}
  cart=[];updateCart();showScr('success');
}

/* ═══════════════════════════════════════
   توست
   ═══════════════════════════════════════ */
function toast(msg,type='ok'){
  const c=document.getElementById('toastC');const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;c.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350)},2200);
}

updateCart();
</script>
</body>
</html>
