<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>حطبة — HATABA</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--safe-b:env(safe-area-inset-bottom,0px);--bg:#080808;--bg2:#0F0F0F;--bg3:#161616;--bg4:#1E1E1E;--bdr:#1C1C1C;--bdr2:#2A2A2A;--gold:#D4A853;--gold2:#E0B865;--gold3:#C49A42;--gBg:rgba(212,168,83,.08);--gBg2:rgba(212,168,83,.15);--txt:#F2EDE4;--txt2:#B0A99C;--txt3:#6E675C;--grn:#5CB870;--red:#D95550}
html,body{height:100%;overflow:hidden;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--txt)}
.screen{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;transform:translateY(12px);display:flex;flex-direction:column}
.screen.on{opacity:1;pointer-events:all;transform:translateY(0)}
#landing{background:var(--bg);justify-content:center;align-items:center;overflow:hidden}
.lBg{position:absolute;inset:0;z-index:0}
.lBg img{width:100%;height:100%;object-fit:cover;opacity:.2;filter:saturate(.6)}
.lBg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,8,.2) 0%,rgba(8,8,8,.6) 40%,rgba(8,8,8,.95) 80%,var(--bg) 100%)}
.lC{position:relative;z-index:1;text-align:center;padding:2rem 1.5rem}
.lLogo{font-size:clamp(4rem,14vw,8rem);font-weight:900;letter-spacing:.1em;line-height:.9;background:linear-gradient(160deg,#F2EDE4 20%,#D4A853 60%,#C49A42 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:lA 1.2s ease both;filter:drop-shadow(0 0 60px rgba(212,168,83,.15))}
.lSub{font-size:clamp(.95rem,3vw,1.3rem);color:var(--txt2);font-weight:300;margin-top:.6rem;animation:lA 1s .3s ease both}
.lLine{width:40px;height:2px;background:var(--gold);margin:1.5rem auto 0;border-radius:2px;animation:lA 1s .5s ease both}
.lCtas{margin-top:2.5rem;display:flex;flex-direction:column;gap:.7rem;align-items:center;animation:lA 1s .65s ease both}
.lBtn1{background:var(--gold);color:var(--bg);font-weight:700;font-size:1.05rem;padding:.85rem 2.8rem;border:none;border-radius:50px;cursor:pointer;transition:all .3s;width:100%;max-width:300px;font-family:inherit;box-shadow:0 4px 24px rgba(212,168,83,.25)}
.lBtn1:hover{background:var(--gold2);transform:translateY(-2px)}
.lBtn1:active{transform:scale(.97)}
.lBtn2{background:transparent;color:var(--txt3);font-weight:500;font-size:.9rem;padding:.7rem 2rem;border:1px solid var(--bdr2);border-radius:50px;cursor:pointer;transition:all .3s;width:100%;max-width:300px;font-family:inherit}
.lBtn2:hover{border-color:var(--gold3);color:var(--gold)}
@keyframes lA{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.chHd{display:flex;align-items:center;gap:.65rem;padding:.55rem .8rem;background:rgba(8,8,8,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);flex-shrink:0;z-index:5;position:relative}
.chHd::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(212,168,83,.15),transparent)}
.chBack{background:none;border:none;color:var(--txt3);font-size:1.1rem;cursor:pointer;padding:.3rem}
.chAv{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--gold3));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.8rem;color:var(--bg);flex-shrink:0}
.chInf{line-height:1.2}.chNm{font-weight:700;font-size:.85rem;display:block}
.chSt{font-size:.62rem;color:var(--grn);display:flex;align-items:center;gap:3px}
.chSt::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--grn);box-shadow:0 0 6px rgba(92,184,112,.5)}
.chCart{margin-right:auto;background:none;border:none;color:var(--txt3);font-size:1rem;cursor:pointer;position:relative;padding:.35rem;border-radius:10px;transition:all .2s}
.chCart:hover{color:var(--gold);background:var(--gBg)}
.cBadge{position:absolute;top:-1px;right:-4px;background:var(--gold);color:var(--bg);font-size:.55rem;font-weight:800;min-width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.cBadge.pop{animation:bP .4s ease}
@keyframes bP{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}
.chMsgs{flex:1;overflow-y:auto;padding:.8rem;display:flex;flex-direction:column;gap:.2rem;scroll-behavior:smooth}
.mW{display:flex;gap:.35rem;max-width:88%;animation:mS .35s ease both}
.mW.ai{align-self:flex-start}.mW.usr{align-self:flex-end;flex-direction:row-reverse}
.mAv{width:26px;height:26px;border-radius:8px;flex-shrink:0;margin-top:auto;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800}
.mW.ai .mAv{background:linear-gradient(135deg,var(--gold),var(--gold3));color:var(--bg)}
.mW.usr .mAv{background:var(--bg4);color:var(--txt3)}
.mBb{padding:.6rem .85rem;border-radius:14px;font-size:.86rem;line-height:1.7;white-space:pre-wrap}
.mW.ai .mBb{background:var(--bg3);border:1px solid var(--bdr);border-top-right-radius:4px}
.mW.usr .mBb{background:linear-gradient(135deg,var(--gold),var(--gold3));color:var(--bg);border-top-left-radius:4px;font-weight:500}
.mTm{font-size:.55rem;color:var(--txt3);margin-top:.15rem;padding:0 .15rem;opacity:.5}
.mW.usr .mTm{text-align:left}
@keyframes mS{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.typW{display:flex;gap:.35rem;align-self:flex-start;animation:mS .25s ease both}
.typW .mAv{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold3));color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:800;flex-shrink:0}
.typD{background:var(--bg3);border:1px solid var(--bdr);border-radius:14px;border-top-right-radius:4px;padding:.6rem .9rem;display:flex;gap:4px;align-items:center}
.typD span{width:6px;height:6px;background:var(--txt3);border-radius:50%;animation:tD 1.4s infinite ease-in-out}
.typD span:nth-child(2){animation-delay:.15s}.typD span:nth-child(3){animation-delay:.3s}
@keyframes tD{0%,60%,100%{opacity:.2;transform:scale(.8)}30%{opacity:1;transform:scale(1.1)}}
.mDate{align-self:center;font-size:.62rem;color:var(--txt3);background:var(--bg3);padding:.2rem .7rem;border-radius:8px;border:1px solid var(--bdr);margin:.3rem 0;animation:mS .35s ease both}
.pCrd{background:var(--bg3);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;margin-top:.4rem;max-width:290px;width:100%;transition:all .3s;position:relative}
.pCrd:hover{border-color:var(--bdr2);transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.pCImg{width:100%;height:140px;object-fit:cover;background:var(--bg2)}
.pCImgFb{width:100%;height:140px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg2),var(--bg4));color:var(--bdr2);font-size:2.2rem}
.pCBdg{position:absolute;top:.5rem;right:.5rem;display:flex;gap:.25rem}
.pBdg{padding:.15rem .5rem;border-radius:7px;font-size:.58rem;font-weight:700;backdrop-filter:blur(8px)}
.pBdg.nw{background:rgba(212,168,83,.2);color:var(--gold);border:1px solid rgba(212,168,83,.25)}
.pBdg.bs{background:rgba(92,184,112,.15);color:var(--grn);border:1px solid rgba(92,184,112,.2)}
.pCBd{padding:.7rem .8rem .8rem}
.pCNm{font-weight:800;font-size:.95rem;margin-bottom:.1rem}
.pCEn{font-size:.62rem;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}
.pCIn{font-size:.72rem;color:var(--txt2);line-height:1.5;margin-bottom:.55rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pCFt{display:flex;align-items:center;justify-content:space-between;gap:.35rem}
.pCPr{font-weight:900;font-size:1.1rem;color:var(--gold)}
.pCPr small{font-size:.68rem;font-weight:400;color:var(--txt3);margin-right:2px}
.pCBts{display:flex;gap:.3rem}
.pBt{padding:.4rem .7rem;border-radius:10px;font-size:.72rem;font-weight:700;border:none;cursor:pointer;transition:all .2s;font-family:inherit}
.pBtAdd{background:var(--gold);color:var(--bg)}.pBtAdd:hover{background:var(--gold2)}
.pBtAlt{background:var(--gBg);color:var(--gold);border:1px solid rgba(212,168,83,.12)}.pBtAlt:hover{background:var(--gBg2)}
.qaBar{flex-shrink:0;padding:.35rem .8rem .15rem;display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none;position:relative}
.qaBar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--bdr),transparent)}
.qaBar::-webkit-scrollbar{display:none}
.qaB{flex-shrink:0;padding:.45rem .85rem;border-radius:20px;font-size:.76rem;font-weight:600;border:1px solid var(--bdr2);background:var(--bg2);color:var(--txt2);cursor:pointer;transition:all .25s;font-family:inherit;white-space:nowrap}
.qaB:hover{border-color:var(--gold3);color:var(--gold);transform:translateY(-1px);box-shadow:0 2px 10px rgba(212,168,83,.1)}
.qaB:active{transform:scale(.96)}
.qaB.gld{background:linear-gradient(135deg,var(--gold),var(--gold3));color:var(--bg);border-color:transparent;font-weight:700}
.qaB.gld:hover{box-shadow:0 4px 18px rgba(212,168,83,.3);transform:translateY(-2px)}
.chIn{flex-shrink:0;display:flex;gap:.4rem;padding:.45rem .8rem calc(.45rem + var(--safe-b));background:rgba(8,8,8,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bdr);position:relative}
.chIn::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(212,168,83,.1),transparent)}
.chIn input{flex:1;background:var(--bg3);border:1px solid var(--bdr);border-radius:14px;padding:.6rem .9rem;color:var(--txt);font-size:.86rem;font-family:inherit;outline:none;transition:all .25s}
.chIn input::placeholder{color:var(--txt3);font-size:.8rem}
.chIn input:focus{border-color:rgba(212,168,83,.4);box-shadow:0 0 0 3px rgba(212,168,83,.06)}
.chSnd{width:38px;height:38px;border-radius:12px;background:var(--gold);border:none;color:var(--bg);font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0}
.chSnd:hover{background:var(--gold2);transform:scale(1.05)}.chSnd:active{transform:scale(.94)}
.mnHd{display:flex;align-items:center;gap:.65rem;padding:.65rem .8rem;background:rgba(8,8,8,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);flex-shrink:0}
.mnHd h2{font-weight:800;font-size:1rem;flex:1}
.mnCats{display:flex;gap:.35rem;padding:.6rem .8rem;overflow-x:auto;scrollbar-width:none;flex-shrink:0;border-bottom:1px solid var(--bdr)}
.mnCats::-webkit-scrollbar{display:none}
.mnTab{flex-shrink:0;padding:.4rem .9rem;border-radius:16px;font-size:.76rem;font-weight:600;border:1px solid var(--bdr);background:transparent;color:var(--txt3);cursor:pointer;transition:all .25s;font-family:inherit;white-space:nowrap}
.mnTab.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700;box-shadow:0 2px 10px rgba(212,168,83,.2)}
.mnGrid{flex:1;overflow-y:auto;padding:.6rem .8rem 2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.6rem;align-content:start}
.mnIt{background:var(--bg3);border:1px solid var(--bdr);border-radius:14px;overflow:hidden;transition:all .3s;animation:mnI .4s ease both}
.mnIt:hover{border-color:var(--bdr2);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
@keyframes mnI{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.mnImg{width:100%;height:120px;object-fit:cover;background:var(--bg2)}
.mnNi{width:100%;height:85px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg2),var(--bg4));color:var(--bdr2);font-size:1.6rem}
.mnBd{padding:.65rem .75rem .75rem}
.mnTop{display:flex;justify-content:space-between;align-items:start;gap:.35rem;margin-bottom:.15rem}
.mnNm{font-weight:700;font-size:.88rem;line-height:1.3}
.mnPr{font-weight:800;color:var(--gold);font-size:.88rem;white-space:nowrap}
.mnIn{font-size:.7rem;color:var(--txt3);line-height:1.5;margin-bottom:.45rem}
.mnAdd{width:100%;padding:.45rem;border-radius:10px;background:var(--gBg);border:1px solid rgba(212,168,83,.1);color:var(--gold);font-size:.76rem;font-weight:700;cursor:pointer;transition:all .25s;font-family:inherit}
.mnAdd:hover{background:var(--gBg2)}.mnAdd:active{transform:scale(.97)}
.cartOv{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(3px)}
.cartOv.on{opacity:1;pointer-events:all}
.cartPn{position:fixed;top:0;left:0;bottom:0;width:min(370px,92vw);background:var(--bg2);z-index:51;transform:translateX(-100%);transition:transform .35s ease;display:flex;flex-direction:column;border-right:1px solid var(--bdr)}
.cartPn.on{transform:translateX(0)}
.cartHd{display:flex;align-items:center;justify-content:space-between;padding:.85rem;border-bottom:1px solid var(--bdr);flex-shrink:0}
.cartHd h2{font-weight:800;font-size:.95rem}
.cartX{background:none;border:none;color:var(--txt3);font-size:1.15rem;cursor:pointer;padding:.25rem;border-radius:8px;transition:all .2s}.cartX:hover{color:var(--txt);background:var(--bg4)}
.cartLs{flex:1;overflow-y:auto;padding:.65rem}
.cartEmp{text-align:center;color:var(--txt3);padding:3rem 1rem;font-size:.82rem}
.cartEmp i{font-size:1.8rem;display:block;margin-bottom:.5rem;color:var(--bdr2)}
.ci{display:flex;gap:.55rem;padding:.55rem 0;border-bottom:1px solid var(--bdr);align-items:center}
.ciImg{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--bg3);flex-shrink:0}
.ciNi{width:44px;height:44px;border-radius:9px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--bdr2);font-size:.9rem;flex-shrink:0}
.ciInf{flex:1;min-width:0}
.ciNm{font-weight:600;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ciPr{font-size:.75rem;color:var(--gold);font-weight:600}
.ciQt{display:flex;align-items:center;gap:.25rem;flex-shrink:0}
.ciQt button{width:22px;height:22px;border-radius:6px;border:1px solid var(--bdr2);background:transparent;color:var(--txt2);font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ciQt button:hover{border-color:var(--gold);color:var(--gold)}
.ciQt span{font-weight:700;font-size:.8rem;min-width:15px;text-align:center}
.ciDl{background:none;border:none;color:var(--txt3);font-size:.7rem;cursor:pointer;padding:.2rem;border-radius:5px;transition:all .2s}.ciDl:hover{color:var(--red);background:rgba(217,85,80,.08)}
.cartFt{padding:.85rem;border-top:1px solid var(--bdr);flex-shrink:0;padding-bottom:calc(.85rem + var(--safe-b));background:var(--bg2)}
.cartTr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.65rem}
.cartTrL{color:var(--txt2);font-size:.82rem}
.cartTrV{font-weight:900;font-size:1.1rem;color:var(--gold)}
.cartGo{width:100%;padding:.7rem;border-radius:12px;background:var(--gold);color:var(--bg);font-weight:700;font-size:.92rem;border:none;cursor:pointer;transition:all .25s;font-family:inherit}
.cartGo:hover{background:var(--gold2);box-shadow:0 4px 18px rgba(212,168,83,.25)}
.cartGo:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.ckBd{flex:1;overflow-y:auto;padding:1rem .8rem}
.ckBd h2{font-weight:800;font-size:1.05rem;margin-bottom:.9rem}
.fg{margin-bottom:.8rem}
.fg label{display:block;font-size:.76rem;color:var(--txt2);margin-bottom:.25rem;font-weight:500}
.fg input,.fg textarea{width:100%;padding:.6rem .85rem;background:var(--bg3);border:1px solid var(--bdr);border-radius:11px;color:var(--txt);font-size:.86rem;font-family:inherit;outline:none;transition:border-color .25s}
.fg input:focus,.fg textarea:focus{border-color:rgba(212,168,83,.4);box-shadow:0 0 0 3px rgba(212,168,83,.06)}
.fg textarea{resize:none;height:60px}
.dTog{display:flex;gap:.35rem;margin-bottom:.9rem}
.dTog button{flex:1;padding:.55rem;border-radius:11px;border:1px solid var(--bdr);background:transparent;color:var(--txt3);font-weight:600;font-size:.8rem;cursor:pointer;transition:all .25s;font-family:inherit}
.dTog button.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.osb{background:var(--bg3);border:1px solid var(--bdr);border-radius:13px;padding:.8rem;margin:.9rem 0}
.osbT{font-weight:700;font-size:.78rem;color:var(--txt3);margin-bottom:.35rem}
.osbI{display:flex;justify-content:space-between;font-size:.8rem;padding:.2rem 0}
.osbI span:last-child{color:var(--txt2)}
.osbTot{display:flex;justify-content:space-between;font-size:.9rem;padding:.4rem 0 0;border-top:1px solid var(--bdr);margin-top:.3rem;font-weight:800}
.osbTot span:last-child{color:var(--gold)}
.ckGo{width:100%;padding:.7rem;border-radius:12px;background:var(--gold);color:var(--bg);font-weight:700;font-size:.92rem;border:none;cursor:pointer;transition:all .25s;font-family:inherit;margin-top:.4rem}
.okScr{background:var(--bg);justify-content:center;align-items:center;text-align:center;padding:2rem}
.okIc{width:72px;height:72px;border-radius:50%;background:rgba(92,184,112,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem;font-size:1.6rem;color:var(--grn);animation:okP .6s ease both;box-shadow:0 0 35px rgba(92,184,112,.1)}
@keyframes okP{from{transform:scale(0);opacity:0}60%{transform:scale(1.15)}to{transform:scale(1);opacity:1}}
.okScr h2{font-weight:800;font-size:1.25rem;margin-bottom:.35rem}
.okScr p{color:var(--txt2);font-size:.88rem;margin-bottom:1.8rem;max-width:260px;line-height:1.6}
.toastC{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:.35rem;align-items:center;pointer-events:none}
.tst{padding:.5rem 1rem;border-radius:10px;font-size:.78rem;font-weight:600;opacity:0;transform:translateY(8px) scale(.95);transition:all .3s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(10px)}
.tst.show{opacity:1;transform:translateY(0) scale(1)}
.tst-ok{background:rgba(92,184,112,.15);color:var(--grn);border:1px solid rgba(92,184,112,.2)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</head>
<body>

</div>

  <div class="chHd">
    <button class="chBack" onclick="goHome()"><i class="fas fa-arrow-right"></i></button>

// ═══ أدوات ═══
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function any(m,a){return a.some(function(k){return m.indexOf(k)!==-1})}
function getTime(){var d=new Date();return('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function scrollBot(){var c=document.getElementById('msgs');setTimeout(function(){c.scrollTop=c.scrollHeight},60)}
function findById(id){for(var i=0;i<MENU.length;i++)if(MENU[i].id===id)return MENU[i];return null}

// ═══ تنقل ═══
function showScr(id){var all=document.querySelectorAll('.screen');for(var i=0;i<all.length;i++)all[i].classList.remove('on');document.getElementById(id).classList.add('on')}
function goHome(){showScr('landing');closeCart()}

// ═══ الشات — عرض ═══
function openChat(){
  showScr('chat');
  var c=document.getElementById('msgs');
  if(c.children.length===0){
    addDateDiv('اليوم');
    setTimeout(function(){
      addAIMsg('هلا 👋 خلني أختار لك شيء يضبط مزاجك اليوم.');
      renderQA(['اختار لي 🍔','معي 25 ريال','أبي شيء حار','أبي ترافل','الأكثر مبيعاً','أبي شيء مشبع']);
    },500);
  }
}
function addDateDiv(t){var d=document.createElement('div');d.className='mDate';d.textContent=t;document.getElementById('msgs').appendChild(d);scrollBot()}
function addAIMsg(text,products){
  var c=document.getElementById('msgs');
  var w=document.createElement('div');w.className='mW ai';
  var h='<div class="mAv">ح</div><div>';
  h+='<div class="mBb">'+esc(text)+'</div>';
  if(products&&products.length){
    for(var i=0;i<products.length;i++) h+=renderPC(products[i]);
  }
  h+='<div class="mTm">'+getTime()+'</div></div>';
  w.innerHTML=h;c.appendChild(w);scrollBot();
}
function addUserMsg(text){
  var c=document.getElementById('msgs');
  var w=document.createElement('div');w.className='mW usr';
  w.innerHTML='<div class="mAv"><i class="fas fa-user" style="font-size:.55rem"></i></div><div><div class="mBb">'+esc(text)+'</div><div class="mTm">'+getTime()+'</div></div>';
  c.appendChild(w);scrollBot();
}
function showTyp(){
  var c=document.getElementById('msgs');
  var d=document.createElement('div');d.className='typW';d.id='typInd';
  d.innerHTML='<div class="mAv">ح</div><div class="typD"><span></span><span></span><span></span></div>';
  c.appendChild(d);scrollBot();
}
function hideTyp(){var e=document.getElementById('typInd');if(e)e.remove()}

function renderPC(p){
  var bdg='';
  if(p.isNew)bdg+='<span class="pBdg nw">جديد</span>';
  if(p.bestSeller)bdg+='<span class="pBdg bs">الأكثر مبيعاً</span>';
  var img=p.image?'<img class="pCImg" src="'+p.image+'" alt="'+p.nameAr+'" onerror="this.outerHTML=\'<div class=\\\'pCImgFb\\\'><i class=\\\'fas fa-burger\\\'></i></div>\'">':'<div class="pCImgFb"><i class="fas fa-burger"></i></div>';
  return '<div class="pCrd">'+img+'<div class="pCBdg">'+bdg+'</div><div class="pCBd"><div class="pCNm">'+p.nameAr+'</div><div class="pCEn">'+p.nameEn+'</div><div class="pCIn">'+p.ingredients.join(' &bull; ')+'</div><div class="pCFt"><div class="pCPr">'+p.price+' <small>ر.س</small></div><div class="pCBts"><button class="pBt pBtAdd" onclick="addFromChat(\''+p.id+'\')">أضف للطلب</button><button class="pBt pBtAlt" onclick="doSendQA(\'أشوف خيارات ثانية\')">ثانية</button></div></div></div></div>';
}

function renderQA(actions){
  var c=document.getElementById('qaBar');var h='';
  for(var i=0;i<actions.length;i++){
    var cls='qaB'+(i===0&&actions.length>2?' gld':'');
    var txt=actions[i].replace(/'/g,'&#39;');
    h+='<button class="'+cls+'" onclick="doSendQA(\''+txt+'\')">'+actions[i]+'</button>';
  }
  c.innerHTML=h;
}

// ═══ الشات — إرسال ═══
function doSend(){var inp=document.getElementById('chatIn');var t=inp.value.trim();if(!t)return;inp.value='';doProcess(t)}
function doSendQA(t){doProcess(t)}

function doProcess(text){
  addUserMsg(text);
  convHist.push({role:'user',text:text});
  renderQA([]);
  showTyp();
  if(apiOK){
    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:convHist.slice(-14),preferences:{}})})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(data){
      hideTyp();
      var prods=[];
      if(data.showProducts)for(var i=0;i<data.showProducts.length;i++){var p=findById(data.showProducts[i]);if(p)prods.push(p)}
      addAIMsg(data.text||'',prods);
      renderQA(data.quickActions||[]);
      convHist.push({role:'model',text:data.text||''});
    })
    .catch(function(e){
      console.log('API fail:',e);
      apiOK=false;
      document.getElementById('aiSt').textContent='محلي';
      fallbackProcess(text);
    });
  }else{
    fallbackProcess(text);
  }
}

function fallbackProcess(text){
  setTimeout(function(){
    hideTyp();
    var r=localAI(text);
    if(!r)return;
    addAIMsg(r.text,r.products||[]);
    renderQA(r.qa||[]);
    convHist.push({role:'model',text:r.text});
  },500+Math.random()*500);
}

// ═══ إضافة من الشات ═══
function addFromChat(pid){
  var p=findById(pid);if(!p)return;
  addToCart(pid);
  if(apiOK){
    var m='أضفت '+p.nameAr+' للسلة';
    addUserMsg(m);convHist.push({role:'user',text:m});showTyp();
    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,history:convHist.slice(-14),preferences:{}})})
    .then(function(r){return r.json()})
    .then(function(data){hideTyp();var prods=[];if(data.showProducts)for(var i=0;i<data.showProducts.length;i++){var pp=findById(data.showProducts[i]);if(pp)prods.push(pp)}addAIMsg(data.text||'',prods);renderQA(data.quickActions||[]);convHist.push({role:'model',text:data.text||''})})
    .catch(function(){hideTyp();var r=onAddResp(pid);if(r){addAIMsg(r.text,r.products||[]);renderQA(r.qa||[]);convHist.push({role:'model',text:r.text})}});
  }else{
    var r=onAddResp(pid);
    if(r){showTyp();setTimeout(function(){hideTyp();addAIMsg(r.text,r.products||[]);renderQA(r.qa||[]);convHist.push({role:'model',text:r.text})},400)}
  }
}

document.getElementById('chatIn').addEventListener('keydown',function(e){if(e.key==='Enter')doSend()});

// ═══ المحرك المحلي ═══
function localAI(msg){
  var m=msg.trim();
  // تحيات
  if(any(m,['كيف حالك','كيفك','كيفحالك','شخبارك','شلونك','شخبار','اهلا','أهلا','هلا','السلام عليكم','مساء الخير','صباح الخير','هلا والله','حياك','حيالله','عساك بخير','وش مسوي'])){
    var rs=['الحمد لله بخير، والأهم كيف أنت؟\nوش تبغى تأكل اليوم نشدحلك','هلا والله، بخير الحمد لله. كيف حالك؟\nخلني أضبط لك طلبك','أهلاً وسهلاً، الحمد لله بخير. وش تبغى اليوم؟'];
    return{text:rs[Math.floor(Math.random()*rs.length)],qa:['اختار لي 🍔','معي 25 ريال','أبي الأكثر مبيعاً','أبي ترافل']};
  }
  // شكر
  if(any(m,['شكرا','شكراً','مشكور','يعطيك العافية','الله يجزاك','ممتاز','حلوة'])){return{text:'العفو 👍 تبغى شيء ثاني؟',qa:['أبي شيء ثاني','لا خلاص']};}
  // ترافل
  if(any(m,['ترافل','truffle'])){var tr=[];for(var i=0;i<MENU.length;i++)if(MENU[i].tags.indexOf('truffle')!==-1)tr.push(MENU[i]);return{text:'ذوقك ممتاز 👏 هذي خيارات الترافل 👇',products:tr,qa:['أشوف خيارات ثانية']};}
  // الأكثر مبيعاً
  if(any(m,['أكثر مبيع','أعلى مبيع','الأكثر مبيعا','best seller','الأفضل','شعبي'])){var bs=[];for(var i=0;i<MENU.length;i++)if(MENU[i].bestSeller&&MENU[i].type==='burger')bs.push(MENU[i]);return{text:'هذي الأكثر مبيعاً عندنا 👇',products:bs,qa:['أبي شيء مختلف','أبي فرايز معه']};}
  // جديد
  if(any(m,['جديد','جديدين'])){var nw=[];for(var i=0;i<MENU.length;i++)if(MENU[i].isNew)nw.push(MENU[i]);return{text:'هذي آخر شيء أضفناه 👇',products:nw,qa:['أبي الأكثر مبيعاً']};}
  // حار
  if(any(m,['حار','حاره','حري','سبايسي','حريق','نار'])){return{text:'عندنا صوص سبايسي ممتاز، تقدر تضيفه لأي برقر ويصير شي ثاني.\nتبغى تختار برقر أولاً؟',qa:['بيف','تشيكن','أبي الأكثر مبيعاً']};}
  // فرايز
  if(any(m,['فرايز','بطاطس'])){var fr=[];for(var i=0;i<MENU.length;i++)if(MENU[i].category==='fries')fr.push(MENU[i]);return{text:'هذي خيارات الفرايز 👇',products:fr,qa:['أبي برقر مع فرايز','رجع للبرقرات']};}
  // سعرات
  if(any(m,['سعرات','كالوري','دايت','حمية','صحي','أخف'])){return{text:'ما عندي معلومات السعرات الحرارية حالياً، لكن أقدر أساعدك تختار شيء أخف.\nمثلاً حطبه تشيكن أخف من حطبه بيف.',qa:['أبي حطبه تشيكن','عادي ما يهم']};}
  // شكوى سعر
  if(any(m,['غالي','سعره عالي','مكلف','أغلى','ما يستاهل','مبالغ فيه'])){return{text:'معك حق، خلنا ننزلها شوي. كم حاب يكون الحد الأعلى؟',qa:['15 ريال','20 ريال','25 ريال']};}
  // منتج بالاسم
  for(var i=0;i<MENU.length;i++){
    if(m.indexOf(MENU[i].nameAr)!==-1){
      return{text:MENU[i].nameAr+'، اختيار ممتاز. سعرها '+MENU[i].price+' ريال.\nتبغى تضيفها للطلب؟',products:[MENU[i]],qa:['أضف للطلب','أبي أشوف خيارات ثانية']};
    }
  }
  // ميزانية
  var budget=null;
  var bp=[/معي\s*(\d+)/,/ميزانيتي?\s*(\d+)/,/بـ?\s*(\d+)\s*ريال/,/(\d+)\s*ريال/,/حد\s*(\d+)/,/أقصى\s*(\d+)/];
  for(var i=0;i<bp.length;i++){var x=m.match(bp[i]);if(x){budget=parseInt(x[x.length-1]);break}}
  if(/^\d+$/.test(m.trim()))budget=parseInt(m.trim());
  // بروتين
  var protein=null;
  if(any(m,['بيف','لحم','beef']))protein='beef';
  if(any(m,['تشيكن','دجاج','chicken']))protein='chicken';
  // توصية
  if(budget&&protein){
    var best=null,bestSc=-999;
    for(var i=0;i<MENU.length;i++){
      var it=MENU[i];if(it.type!=='burger')continue;if(it.price>budget)continue;
      var sc=0;if(it.protein===protein)sc+=15;if(it.bestSeller)sc+=5;if(it.isNew)sc+=3;if(sc>bestSc){bestSc=sc;best=it}
    }
    if(best){
      var rem=budget-best.price;var extra='';
      if(rem>=7)extra='\nباقي لك '+rem+' ريال. الفرنش فرايز بـ7 ريال تكمل وجبتك.';
      else if(rem>=3)extra='\nباقي لك '+rem+' ريال. تقدر تضيف صوص حطبه بـ3 ريال.';
      return{text:'عندك '+budget+' ريال. أنصحك بـ'+best.nameAr+' 👇'+extra,products:[best],qa:rem>=7?['أضيف له فرايز','أشوف خيارات ثانية']:['أشوف خيارات ثانية']};
    }
    return{text:'ما لقيت شيء يناسب ميزانيتك. تبغى تزيدها شوي؟',qa:['زود 5 ريال','أبي أشوف المنيو']};
  }
  if(budget){
    var best=null,bestSc=-999;
    for(var i=0;i<MENU.length;i++){var it=MENU[i];if(it.type!=='burger')continue;if(it.price>budget)continue;var sc=0;if(it.bestSeller)sc+=5;if(it.isNew)sc+=3;if(sc>bestSc){bestSc=sc;best=it}}
    if(best)return{text:'عندك '+budget+' ريال. أرشح لك '+best.nameAr+' 👇',products:[best],qa:['أبي بيف','أبي تشيكن','أشوف خيارات ثانية']};
  }
  if(protein){
    var items=[];for(var i=0;i<MENU.length;i++)if(MENU[i].type==='burger'&&MENU[i].protein===protein)items.push(MENU[i]);
    return{text:'هذي خيارات ال'+(protein==='beef'?'بيف':'تشيكن')+' 👇',products:items,qa:['أبي شيء مختلف','أبي فرايز معه']};
  }
  // خارج النطاق
  if(any(m,['سيارة','سيارات','مباراة','كرة','فريق','انتخابات','سياسة','برمجة','كود','مدرسة','جامعة','طب','دكتور','علاج','دواء','طقس','سهم','أسهم','تداول','بنك','قرض','وظيفة','سفر','طيران','فندق','زواج','دين','فتوى'])){
    var rs=['هههه سؤال بعيد عن البرقر 😄 أنا شغلي أخليك تطلع من حطبة مبسوط.','خلنا نخلي المواضيع الثانية على جنب 😄 أنا هنا عشان أساعدك تختار طلبك.'];
    return{text:rs[Math.floor(Math.random()*rs.length)],qa:['اختار لي 🍔','معي 25 ريال','أبي الأكثر مبيعاً']};
  }
  // افتراضي
  if(!protein)return{text:'خلني أضبطها لك.\nأنت اليوم داخل على برقر ولا شيء خفيف؟',qa:['برقر','شيء خفيف','أبي الأكثر مبيعاً']};
  if(!budget)return{text:'ميزانيتك تقريباً كم؟ عشان أضبط لك الخيارات.',qa:['معي 20 ريال','معي 25 ريال','معي 30 ريال','أبي أفضل شيء مهما كان السعر']};
  return{text:'وش تبغى بالضبط؟',qa:['أبي بيف','أبي تشيكن','أبي ترافل','أبي الأكثر مبيعاً']};
}

function onAddResp(pid){
  var p=findById(pid);if(!p)return null;
  return{text:'حلو، أضفناه 👍',qa:['أتمم الطلب','أبي شيء ثاني']};
}

// ═══ المنيو ═══
function openMenu(){showScr('menu');renderMenu()}
function renderMenu(){
  var c=document.getElementById('mnCats');var h='';
  for(var i=0;i<CATS.length;i++){
    h+='<button class="mnTab'+(CATS[i].id===activeCat?' on':'')+'" onclick="swCat(\''+CATS[i].id+'\')">'+CATS[i].n+'</button>';
  }
  c.innerHTML=h;renderMItems();
}
function swCat(id){activeCat=id;renderMenu()}
function renderMItems(){
  var g=document.getElementById('mnGrid');var h='';var idx=0;
  for(var i=0;i<MENU.length;i++){
    var it=MENU[i];if(it.category!==activeCat)continue;
    var bdg='';if(it.isNew)bdg+='<span class="pBdg nw">جديد</span>';if(it.bestSeller)bdg+='<span class="pBdg bs">الأكثر مبيعاً</span>';
    var img=it.image?'<img class="mnImg" src="'+it.image+'" alt="'+it.nameAr+'" onerror="this.outerHTML=\'<div class=\\\'mnNi\\\'><i class=\\\'fas fa-burger\\\'></i></div>\'">':'<div class="mnNi"><i class="fas fa-'+catIcon(it.category)+'"></i></div>';
    h+='<div class="mnIt" style="animation-delay:'+idx*.06+'s">'+img+'<div class="mnBd"><div class="mnBd" style="padding:0 0 .25rem">'+bdg+'</div><div class="mnTop"><div class="mnNm">'+it.nameAr+'</div><div class="mnPr">'+it.price+' ر.س</div></div><div class="mnIn">'+it.nameEn+(it.ingredients.length?' &bull; '+it.ingredients.join(', '):'')+'</div><button class="mnAdd" onclick="addToCart(\''+it.id+'\')"><i class="fas fa-plus" style="margin-left:.2rem"></i>أضف للسلة</button></div></div>';
    idx++;
  }
  g.innerHTML=h;
}

// ═══ السلة ═══
function addToCart(pid){
  var p=findById(pid);if(!p)return;
  var found=false;
  for(var i=0;i<cart.length;i++){if(cart[i].id===pid){cart[i].qty++;found=true;break}}
  if(!found)cart.push({id:p.id,nameAr:p.nameAr,nameEn:p.nameEn,price:p.price,image:p.image,category:p.category,qty:1});
  updateCart();toast('تمت إضافة '+p.nameAr);
}
function remCart(pid){var nc=[];for(var i=0;i<cart.length;i++)if(cart[i].id!==pid)nc.push(cart[i]);cart=nc;updateCart();renderCartList()}
function chgQty(pid,d){
  for(var i=0;i<cart.length;i++){
    if(cart[i].id===pid){cart[i].qty+=d;if(cart[i].qty<=0){remCart(pid);return}break}
  }
  updateCart();renderCartList();
}
function cartTot(){var s=0;for(var i=0;i<cart.length;i++)s+=cart[i].price*cart[i].qty;return s}
function cartCnt(){var s=0;for(var i=0;i<cart.length;i++)s+=cart[i].qty;return s}
function updateCart(){
  var cnt=cartCnt(),tot=cartTot();
  var b1=document.getElementById('cb1'),b2=document.getElementById('cb2');
  if(cnt>0){b1.style.display='flex';b1.textContent=cnt;b1.classList.remove('pop');void b1.offsetWidth;b1.classList.add('pop');b2.style.display='flex';b2.textContent=cnt;b2.classList.remove('pop');void b2.offsetWidth;b2.classList.add('pop')}
  else{b1.style.display='none';b2.style.display='none'}
  document.getElementById('cartTot').textContent=tot+' ر.س';
  document.getElementById('cartGo').disabled=cnt===0;
  renderCartList();
}
function renderCartList(){
  var c=document.getElementById('cartLs');
  if(!cart.length){c.innerHTML='<div class="cartEmp"><i class="fas fa-bag-shopping"></i>السلة فاضية</div>';return}
  var h='';
  for(var i=0;i<cart.length;i++){
    var it=cart[i];
    var img=it.image?'<img class="ciImg" src="'+it.image+'" alt="">':'<div class="ciNi"><i class="fas fa-'+catIcon(it.category)+'"></i></div>';
    h+='<div class="ci">'+img+'<div class="ciInf"><div class="ciNm">'+it.nameAr+'</div><div class="ciPr">'+it.price*it.qty+' ر.س</div></div><div class="ciQt"><button onclick="chgQty(\''+it.id+'\') ,-1)"><i class="fas fa-minus" style="font-size:.5rem"></i></button><span>'+it.qty+'</span><button onclick="chgQty(\''+it.id+'\',1)"><i class="fas fa-plus" style="font-size:.5rem"></i></button></div><button class="ciDl" onclick="remCart(\''+it.id+'\')"><i class="fas fa-trash-can"></i></button></div>';
  }
  c.innerHTML=h;
}
function toggleCart(){
  var o=document.getElementById('cartOv'),p=document.getElementById('cartPn');
  if(p.classList.contains('on')){o.classList.remove('on');p.classList.remove('on')}
  else{renderCartList();o.classList.add('on');p.classList.add('on')}
}
function closeCart(){document.getElementById('cartOv').classList.remove('on');document.getElementById('cartPn').classList.remove('on')}

// ═══ تسجيل الطلب ═══
function goCheckout(){if(!cart.length)return;closeCart();showScr('checkout');renderCK()}
function renderCK(){
  var b=document.getElementById('ckBd');var t=cartTot();
  var addrField=delType==='delivery'?'<div class="fg"><label>عنوان التوصيل</label><textarea id="cAddr" placeholder="الحي، الشارع، رقم المبنى"></textarea></div>':'';
  var h='<h2>بيانات التوصيل</h2><div class="dTog"><button class="'+(delType==='delivery'?'on':'')+'" onclick="setDT(\'delivery\')"><i class="fas fa-motorcycle" style="margin-left:.2rem"></i>توصيل</button><button class="'+(delType==='pickup'?'on':'')+'" onclick="setDT(\'pickup\')"><i class="fas fa-store" style="margin-left:.2rem"></i>استلام</button></div><div class="fg"><label>الاسم</label><input type="text" id="cName" placeholder="اسمك الكامل"></div><div class="fg"><label>رقم الجوال</label><input type="tel" id="cPhone" placeholder="05XXXXXXXX" dir="ltr" style="text-align:right"></div>'+addrField+'<div class="fg"><label>ملاحظات (اختياري)</label><textarea id="cNotes" placeholder="أي طلبات خاصة"></textarea></div><div class="osb"><div class="osbT">ملخص الطلب</div>';
  for(var i=0;i<cart.length;i++)h+='<div class="osbI"><span>'+cart[i].nameAr+' × '+cart[i].qty+'</span><span>'+cart[i].price*cart[i].qty+' ر.س</span></div>';
  h+='<div class="osbTot"><span>المجموع</span><span>'+t+' ر.س</span></div></div><button class="ckGo" onclick="submitOrder()">تأكيد الطلب — '+t+' ر.س</button>';
  b.innerHTML=h;
}
function setDT(t){delType=t;renderCK()}
function submitOrder(){
  var n=document.getElementById('cName');var p=document.getElementById('cPhone');
  if(!n||!n.value.trim()){toast('أدخل اسمك','err');return}
  if(!p||!p.value.trim()||p.value.trim().length<10){toast('أدخل رقم جوال صحيح','err');return}
  if(delType==='delivery'){var a=document.getElementById('cAddr');if(!a||!a.value.trim()){toast('أدخل عنوان التوصيل','err');return}}
  cart=[];updateCart();showScr('success');
}

// ═══ توست ═══
function toast(msg,type){
  var c=document.getElementById('toastC');var t=document.createElement('div');
  t.className='tst tst-'+(type||'ok');t.textContent=msg;c.appendChild(t);
  requestAnimationFrame(function(){t.classList.add('show')});
  setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},350)},2200);
}

updateCart();
</script>
</body>
</html>
