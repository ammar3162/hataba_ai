/* ══════════════════════════════════════════
   محرك الذكاء الاصطناعي المحلي (Fallback)
   ══════════════════════════════════════════ */
class HatabaAI{
  constructor(){this.reset()}
  reset(){
    this.prefs={budget:null,protein:null,flavor:null,truffle:false,spicy:false,hunger:null,people:1,goal:null,mealType:null,calorieConscious:false};
    this.asked=new Set();
    this.lastRecommendation=null;
    this.messageCount=0;
    this.awaitingAddResponse=null;
    this.detectedGender=null; // 'male' | 'female' | null
    this.detectedName=null;
    this.mood=null; // 'playful' | 'sad' | 'angry' | 'hurried' | 'chatty' | null
  }

  /* ═══════ المعالجة الرئيسية ═══════ */
  process(msg){
    this.messageCount++;
    const m=msg.trim();
    if(!m)return null;

    // لو ينتظر رد على إضافة
    if(this.awaitingAddResponse){
      const r=this.awaitingAddResponse;
      this.awaitingAddResponse=null;
      if(this.isYes(m))return r.onYes;
      if(this.isNo(m))return r.onNo;
    }

    // 1) كشف الجنس والاسم (قبل أي شيء)
    this.detectGenderName(m);

    // 2) تحليل المزاج
    this.detectMood(m);

    // 3) تحيات وأحوال — نرد طبيعي ثم نرجع للأكل
    const greeting=this.handleGreeting(m);
    if(greeting)return greeting;

    // 4) مزح — نرد بالمزح ثم نرجع
    const joke=this.handleJoke(m);
    if(joke)return joke;

    // 5) مشاعر سلبية
    const sad=this.handleEmotion(m);
    if(sad)return sad;

    // 6) مواضيع خارجية بذكاء
    if(this.isOffTopic(m))return this.respOffTopic();

    // 7) شكوى سعر
    if(this.isPriceComplaint(m))return this.respPriceComplaint();

    // 8) استخراج الكيانات
    this.extractEntities(m);

    // 9) طلب منتج بالاسم
    const named=this.findProduct(m);
    if(named&&this.messageCount<=3){
      const g=this.detectedGender==='female'?'اختيار حلو':'اختيار ممتاز';
      return{text:`${g}، ${named.nameAr} سعرها ${named.price} ريال.\nتبغى تضيفها للطلب؟`,products:[named],quickActions:['أضف للطلب','أبي أشوف خيارات ثانية']};
    }

    // 10) طلبات نوعية
    if(this.hasAny(m,['ترافل','truffle'])){this.prefs.truffle=true;return this.respTruffle()}
    if(this.hasAny(m,['أكثر مبيع','أعلى مبيع','الأكثر مبيعا','best seller','الأفضل','شعبي']))return this.respBestSeller();
    if(this.hasAny(m,['جديد','جديدين','مستجد','حديث']))return this.respNew();
    if(this.hasAny(m,['حار','حاره','حري','سبايسي','حريق','نار'])){this.prefs.spicy=true;return this.respSpicy()}
    if(this.hasAny(m,['فرايز','بطاطس']))return this.respFries();
    if(this.hasAny(m,['منيو','المنيو']))return{text:'تمام، تقدر تشوف المنيو من فوق. أو قولي وش تبغى وأنا ألخص لك.',quickActions:this.getQA()};
    if(this.hasAny(m,['سلة','السلة','طلباتي']))return{text:'تقدر تفتح السلة من أيقونة الشنطة فوق.',quickActions:this.getQA()};
    if(this.hasAny(m,['سعرات','كالوري','دايت','حمية','صحي','أخف','خفيف من المكونات'])){this.prefs.calorieConscious=true;return{text:'ما عندي معلومات السعرات الحرارية حالياً، لكن أقدر أساعدك تختار شيء أخف من ناحية المكونات.\nمثلاً حطبه تشيكن أخف من حطبه بيف.',quickActions:['أبي حطبه تشيكن','عادي ما يهم']};}
    if(this.hasAny(m,['شكرا','شكراً','مشكور','يعطيك العافية','الله يجزاك','ممتاز','حلوة']))return{text:this.detectedGender==='female'?'العفو حبيبتي 😊 تبغى شيء ثاني؟':this.detectedGender==='male'?'العفو يا صاحبي 👍 تبغى شيء ثاني؟':'العفو 👍 تبغى شيء ثاني؟',quickActions:['أبي شيء ثاني','لا خلاص']};

    // 11) عدد أشخاص
    const ppl=m.match(/نحن\s*(\d+)|(\d+)\s*(أشخاص|اشخاص|شخص|نفر)/);
    if(ppl){this.prefs.people=parseInt(ppl[1]||ppl[2]);return{text:`تمام، ${this.prefs.people} أشخاص.\nتحبون كل واحد يختار برقره ولا تبغون تشكيلة نتشاركها؟`,quickActions:['كل واحد يختار','تشكيلة نتشاركها']}}

    // 12) توصية أم سؤال
    if(this.shouldRecommend())return this.recommend();
    return this.askNext();
  }

  }

  /* ═══════ استخراج الكيانات ═══════ */
  extractEntities(m){
    const bp=[/معي\s*(؟)?\s*(\d+)/,/ميزانيتي?\s*(؟)?\s*(\d+)/,/بـ?\s*(\d+)\s*ريال/,/(\d+)\s*ريال/,/حد\s*(؟)?\s*(\d+)/,/أقصى\s*(؟)?\s*(\d+)/,/ما\s*[أا]بغى\s*[أا]خرج\s*عن\s*(\d+)/,/ما\s*[أا]بي\s*[أا]طلع\s*عن\s*(\d+)/,/مابي\s*اخرج\s*عن\s*(\d+)/];
    for(const p of bp){const x=m.match(p);if(x){this.prefs.budget=parseInt(x[x.length-1]);break}}
    if(/^\d+$/.test(m.trim())&&!this.prefs.budget)this.prefs.budget=parseInt(m.trim());
    if(this.hasAny(m,['بيف','لحم','beef']))this.prefs.protein='beef';
    if(this.hasAny(m,['تشيكن','دجاج','chicken']))this.prefs.protein='chicken';
    if(this.hasAny(m,['مشبع','شبعان','جوعان','ويان','أبي أكل كثير','جوع']))this.prefs.hunger='high';
    if(this.hasAny(m,['خفيف','قليل','سناك','وجبة خفيفة','ما أبي كثير','شيء بسيط']))this.prefs.hunger='low';
    if(this.hasAny(m,['يستاهل','قيمة','أفضل قيمة','وفر','مقابل سعر']))this.prefs.goal='best_value';
    if(this.hasAny(m,['مهما كان السعر','الممتاز','الفخم','الاحترافي','الأفضل بلا حدود']))this.prefs.goal='best_experience';
    if(this.hasAny(m,['أجرب','شيء جديد','تجربة جديدة','ما جربت','أبي أجرب']))this.prefs.goal='try_new';
    if(this.hasAny(m,['كلاسيك','عادي','بسيط','معتاد','العادة','مألوف']))this.prefs.flavor='classic';
    if(this.hasAny(m,['مختلف','تجربة','مميز','خاص','يجنن','قوي النكهة','نكهة قوية']))this.prefs.flavor='adventurous';
    if(this.hasAny(m,['ترافل','truffle']))this.prefs.truffle=true;
    if(this.hasAny(m,['برقر','برجر','ساندويش','ساندوتش']))this.prefs.mealType='burger';
    if(this.hasAny(m,['وجبة','كمبو','سيت','meal','كامل']))this.prefs.mealType='full_meal';
  }

  /* ═══════ هل نوصّي؟ ═══════ */
  shouldRecommend(){
    const p=this.prefs;
    if(p.budget&&p.protein)return true;
    if(p.budget&&p.goal)return true;
    if(p.protein&&p.flavor)return true;
    if(p.protein&&p.truffle)return true;
    if(p.budget&&this.messageCount>=3)return true;
    if(p.protein&&p.hunger==='high')return true;
    return false;
  }

  /* ═══════ السؤال التالي ═══════ */
  askNext(){
    const p=this.prefs;const g=this.detectedGender;
    if(!p.protein&&!p.truffle&&!p.spicy&&!p.goal){
      if(g==='female')return{text:'خلني أفهم ذوقك شوي.\nأنتي اليوم ناوية على برقر ولا شيء خفيف؟',quickActions:['برقر','شيء خفيف','أبي الأكثر مبيعاً']};
      if(g==='male')return{text:'خلني أضبطها لك.\nأنت اليوم داخل على برقر ولا شيء خفيف؟',quickActions:['برقر','شيء خفيف','أبي الأكثر مبيعاً']};
      return{text:'خلني أضبطها لك.\nأنت اليوم داخل على برقر ولا شيء خفيف؟',quickActions:['برقر','شيء خفيف','أبي الأكثر مبيعاً']};
    }
    if(!p.protein&&!p.truffle){
      return{text:'بيف ولا تشيكن؟',quickActions:['بيف','تشيكن','لا يهم']};
    }
    if(!p.flavor&&!p.truffle&&!p.goal){
      return{text:'تحب النكهة الكلاسيكية ولا ودك نجرب شيء مختلف؟',quickActions:['كلاسيكية','شيء مختلف','أبي ترافل']};
    }
    if(!p.budget){
      if(g==='female')return{text:'ميزانيتك تقريباً كم؟ عشان أختار لك الأحسن.',quickActions:['معي 20 ريال','معي 25 ريال','معي 30 ريال','أبي أفضل شيء']};
      return{text:'ميزانيتك تقريباً كم؟ عشان أضبط لك الخيارات.',quickActions:['معي 20 ريال','معي 25 ريال','معي 30 ريال','أبي أفضل شيء مهما كان السعر']};
    }
    return this.recommend();
  }

  /* ═══════ التوصية ═══════ */
  recommend(){
    const p=this.prefs;let candidates=[];
    if(p.budget)candidates=this.buildCombos(p.budget);
    else candidates=this.filterScore(MENU.filter(i=>i.type==='burger'),p);
    if(!candidates.length)return{text:'ما لقيت شيء يناسب اللي تبغاه بهالميزانية. تبغى تزيد الميزانية شوي؟',quickActions:['زود 5 ريال','أبي أشوف المنيو']};
    const top=candidates.slice(0,2);
    const mains=[...new Map(top.map(c=>[c.items[0].id,c.items[0]])).values()];
    let reason=this.buildReason(top[0],p);
    let text='';
    const g=this.detectedGender;
    if(mains.length===1&&top[0].items.length===1){
      text=g==='female'?`أعتقد هذي أقرب شيء لذوقك 👇\n${reason}`:`أعتقد هذا أقرب شيء لذوقك 👇\n${reason}`;
    }else if(top[0].items.length>1){
      text=`عندك وجبة كاملة ضمن ميزانيتك 👇\n${reason}`;
    }else{
      text=`عندك خيارين حلوين:\n${reason}`;
    }
    this.lastRecommendation=top;
    const qa=['أشوف خيارات ثانية'];
    if(top[0].items.length===1&&p.budget&&top[0].total<p.budget){
      const rem=p.budget-top[0].total;
      if(rem>=7)qa.unshift('أضيف له فرايز');
      else if(rem>=3)qa.unshift('أضيف له صوص');
    }
    return{text,products:mains,quickActions:qa};
  }

  /* ═══════ بناء كمبات ═══════ */
  buildCombos(budget){
    const p=this.prefs;
    const burgers=MENU.filter(i=>i.type==='burger');
    const sides=MENU.filter(i=>i.type==='side'&&i.category!=='sauces');
    const drinks=MENU.filter(i=>i.type==='drink');
    const combos=[];
    for(const b of burgers){
      if(b.price>budget)continue;
      combos.push({items:[b],total:b.price,score:this.scoreItem(b,p)});
      const rem=budget-b.price;
      for(const s of sides){
        if(s.price<=rem){
          combos.push({items:[b,s],total:b.price+s.price,score:this.scoreItem(b,p)+this.scoreItem(s,p)*.5+10});
          const r2=rem-s.price;
          for(const d of drinks){if(d.price<=r2)combos.push({items:[b,s,d],total:b.price+s.price+d.price,score:this.scoreItem(b,p)+this.scoreItem(s,p)*.5+this.scoreItem(d,p)*.2+20})}
        }
      }
      for(const d of drinks){if(d.price<=rem)combos.push({items:[b,d],total:b.price+d.price,score:this.scoreItem(b,p)+this.scoreItem(d,p)*.2+5})}
    }
    combos.sort((a,b)=>{
      const au=a.total/budget,bu=b.total/budget;
      const ab=au>=.8&&au<=1?15:au>=.6?5:-10;
      const bb=bu>=.8&&bu<=1?15:bu>=.6?5:-10;
      return(b.score+bb)-(a.score+ab);
    });
    const seen=new Set();
    return combos.filter(c=>{const k=c.items.map(i=>i.id).sort().join(',');if(seen.has(k))return false;seen.add(k);return true}).slice(0,4);
  }

  scoreItem(item,p){
    let s=0;
    if(p.protein&&item.protein===p.protein)s+=15;
    if(p.protein&&item.protein&&item.protein!==p.protein)s-=20;
    if(p.truffle&&item.tags.includes('truffle'))s+=15;
    if(p.spicy&&item.tags.includes('spicy'))s+=12;
    if(p.flavor==='classic'&&item.tags.includes('classic'))s+=10;
    if(p.flavor==='adventurous'&&(item.tags.includes('truffle')||item.tags.includes('loaded')))s+=12;
    if(p.goal==='best_value'&&item.bestSeller)s+=8;
    if(p.goal==='best_experience'&&item.tags.includes('truffle'))s+=10;
    if(p.goal==='try_new'&&item.isNew)s+=12;
    if(item.bestSeller)s+=4;
    if(item.isNew)s+=2;
    return s;
  }

  filterScore(items,p){return items.map(i=>({items:[i],total:i.price,score:this.scoreItem(i,p)})).filter(c=>c.score>0).sort((a,b)=>b.score-a.score)}

  buildReason(combo,p){
    const m=combo.items[0];const r=[];
    if(p.truffle&&m.tags.includes('truffle'))r.push('لأنك تحب الترافل');
    if(p.protein==='beef'&&m.protein==='beef')r.push('بيف كما تبغى');
    if(p.protein==='chicken'&&m.protein==='chicken')r.push('تشيكن كما تبغى');
    if(p.flavor==='classic')r.push('نكهة كلاسيكية');
    if(p.flavor==='adventurous')r.push('نكهة مميزة ومختلفة');
    if(p.goal==='best_value')r.push('أفضل قيمة مقابل السعر');
    if(p.goal==='best_experience')r.push('أفضل تجربة');
    if(p.goal==='try_new')r.push('من المنتجات الجديدة');
    if(m.bestSeller&&!r.length)r.push('الأكثر مبيعاً عندنا');
    if(combo.items.length>1)r.push(`وجبة كاملة بـ${combo.total} ريال`);
    else r.push(`سعرها ${m.price} ريال`);
    return r.join('، ');
  }

  /* ═══════ أدوات ═══════ */
  hasAny(m,kw){return kw.some(k=>m.includes(k))}
  isPriceComplaint(m){return this.hasAny(m,['غالي','سعره عالي','مكلف','أغلى','ما يستاهل','مبالغ فيه'])}

  isNo(m){return this.hasAny(m,['لا','لاا','أبدا','ما أبي','ما أبغى','خلاص','لا يهم','لا لا'])}
  findProduct(m){return MENU.find(i=>m.includes(i.nameAr)||m.toLowerCase().includes(i.nameEn.toLowerCase()))}
  getQA(){

    return b.slice(0,6);
  }

const CLAUDE_SYSTEM_PROMPT=`أنت "حطبة"، مساعد ذكي داخل تطبيق مطعم برقر سعودي اسمه HATABA. جمهورك سعودي/خليجي وتتكلم بلهجة سعودية دارجة، ودودة، فيها لمسة خفة دم بسيطة بدون مبالغة.

مهمتك: تساعد الزبون يقرر وش يطلب من المنيو الحقيقي المرفق أدناه — لا تخترع أصناف أو أسعار غير موجودة فيه أبداً.

قواعد أساسية:
1) اسأل أسئلة قصيرة لما تحتاج تفهم الزبون: بيف ولا تشيكن، جوعان (وجبة مشبعة) ولا شيء خفيف، ميزانيته كم.
2) لو الزبون قال إن السعر غالي أو اشتكى من السعر، لا تجادله — تعاطف بسرعة واسأله "كم عندك تقريباً؟" وبعدها رشّح له أصناف أو تشكيلة تناسب ميزانيته بالضبط من المنيو.
3) دايم رشّح صنف رئيسي واحد أو اثنين بالضبط (مو أكثر) عن طريق حقل showProducts بمعرفات (id) حقيقية من المنيو.
4) بعد ما ترشح، اقترح إضافة تكميلية بجملة مغرية طبيعية (مثال: "لو أخذت معه X بيطلع رهيب" أو "أغلب الزباين يضيفون معها Y" أو تذكير إنه من الأكثر مبيعاً / منتج جديد) — هذا اقتراح فقط، أنت لا تضيف شيء للسلة ولا "تطلب" نيابة عنه أبداً، الإضافة تصير فقط لما الزبون يضغط زر "أضف للطلب" في الواجهة. لا تقول أبداً "تم إضافة" أو "طلبك جاهز" لأنك لا تتحكم بالسلة.
5) اكتشف من كلام الزبون جنسه إذا كان واضح (أسماء، ضمائر، "حبيبتي/يا صاحبي") وخاطبه بأسلوب مناسب بدون افتراضات غريبة، وإذا ذكر اسمه استخدمه بلطف بين فترة وفترة.
6) لو مزح الزبون معك، جاوب بخفة دم بسيطة ورجّعه بسلاسة لموضوع الطلب.
7) لو سأل عن شيء بره نطاق المطعم (سياسة، رياضة، طقس...)، اعتذر بلطف وخفة إنه مو مجالك وارجعه للطلب.
8) خلي كل رد قصير: سطر أو سطرين كحد أقصى، ما يزيد عن 3 أسطر أبداً.
9) لا تكرر نفس الصيغة كل مرة، نوّع بأسلوبك الطبيعي.

مهم جداً بخصوص شكل الرد: رد فقط بكائن JSON صافي بدون أي نص قبله أو بعده وبدون Markdown fences، بهذا الشكل بالضبط:
{"text":"نص الرد المعروض للزبون","showProducts":["id1","id2"],"quickActions":["رد سريع 1","رد سريع 2","رد سريع 3"]}
- showProducts: مصفوفة معرفات (id) من المنيو المرفق فقط، فاضية [] لو ما فيه داعي تعرض منتج.
- quickActions: 2 إلى 4 اقتراحات ردود قصيرة جداً (كلمة لين ٣ كلمات) الزبون يقدر يضغطها بدل ما يكتب.

هذا المنيو الكامل (JSON)، هذا مصدر الحقيقة الوحيد للأصناف والأسعار:
${JSON.stringify(MENU_FOR_AI)}`;

async function processUserMsg(text){
  addUserMessage(text);
  conversationHistory.push({role:'user',text});
  renderQuickActions([]);
  showTyping();

  if(apiAvailable){
    try{
      const res=await callClaudeAPI(text);
      hideTyping();
      const products=(res.showProducts||[]).map(id=>MENU.find(i=>i.id===id)).filter(Boolean);
      addAIMessage(res.text,products);
      renderQuickActions(res.quickActions||[]);
      conversationHistory.push({role:'model',text:res.text});
      updateLocalPrefs(text); // نحدث تفضيلات المحرك المحلي أيضاً احتياطاً
      return;
    }catch(e){
      console.log('تعذر الوصول لكلود، ننتقل للمحرك المحلي:',e.message);
      apiAvailable=false;
      document.getElementById('aiStatusText').textContent='وضع محلي';
    }
  }

  // Fallback: المحرك المحلي
  const delay=600+Math.random()*600;
  setTimeout(()=>{
    hideTyping();
    const resp=ai.process(text);
    if(!resp)return;
    addAIMessage(resp.text,resp.products||[]);
    renderQuickActions(resp.quickActions||[]);
    conversationHistory.push({role:'model',text:resp.text});
  },delay);
}

function updateLocalPrefs(text){ai.extractEntities(text)}

/* نداء مباشر لـ Claude عبر واجهة Anthropic Messages API */
async function callClaudeAPI(message){
  const msgs=conversationHistory.slice(-14).map(h=>({role:h.role==='user'?'user':'assistant',content:h.text}));
  msgs.push({role:'user',content:message});
  const response=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({system:CLAUDE_SYSTEM_PROMPT,messages:msgs})
  });
  if(!response.ok){
    let msg=`HTTP ${response.status}`;
    try{const e=await response.json();if(e.error)msg=e.error}catch(_){}
    throw new Error(msg);
  }
  const parsed=await response.json();
  if(!parsed.text)throw new Error('bad shape');
  return parsed;
}

function addFromChat(pid){
  addToCart(pid);
  const product=MENU.find(i=>i.id===pid);
  const addMsg=`أضفت ${product.nameAr} للسلة`;
  if(apiAvailable){
    addUserMessage(addMsg);
    conversationHistory.push({role:'user',text:addMsg});
    showTyping();
    callClaudeAPI(addMsg).then(res=>{
      hideTyping();
      const products=(res.showProducts||[]).map(id=>MENU.find(i=>i.id===id)).filter(Boolean);
      addAIMessage(res.text,products);
      renderQuickActions(res.quickActions||[]);
      conversationHistory.push({role:'model',text:res.text});
    }).catch(()=>{
      hideTyping();
      apiAvailable=false;
      document.getElementById('aiStatusText').textContent='وضع محلي';
      const resp=ai.onProductAdded(pid);
      if(resp){addAIMessage(resp.text,resp.products||[]);renderQuickActions(resp.quickActions||[]);conversationHistory.push({role:'model',text:resp.text})}
    });
  }else{
    const resp=ai.onProductAdded(pid);
    if(resp){showTyping();setTimeout(()=>{hideTyping();addAIMessage(resp.text,resp.products||[]);renderQuickActions(resp.quickActions||[]);conversationHistory.push({role:'model',text:resp.text})},500)}
  }
}

  renderCartItems();
}
function renderCartItems(){
  const c=document.getElementById('cartItems');
  if(!cart.length){c.innerHTML=`<div class="cart-empty"><div style="font-size:2.2rem;margin-bottom:.75rem;opacity:.5">${ic('bag')}</div>السلة فاضية</div>`;return}
  c.innerHTML=cart.map(i=>{
    const img=i.image?`<img class="ci-img" src="${i.image}" alt="" onerror="this.outerHTML='<div class=\\'ci-no-img\\'>${ic('burger')}</div>'">`:`<div class="ci-no-img">${ic(getIcon(i.category))}</div>`;
    return`<div class="ci-item">${img}<div class="ci-info"><div class="ci-name">${i.nameAr}</div><div class="ci-price">${i.price*i.qty} ر.س</div></div><div class="ci-qty"><button onclick="changeQty('${i.id}',-1)">${ic('minus')}</button><span>${i.qty}</span><button onclick="changeQty('${i.id}',1)">${ic('plus')}</button></div><button class="ci-remove" onclick="removeFromCart('${i.id}')">${ic('trash')}</button></div>`;
  }).join('');
}
function toggleCart(){const o=document.getElementById('cartOverlay'),p=document.getElementById('cartPanel');if(p.classList.contains('open')){o.classList.remove('open');p.classList.remove('open')}else{renderCartItems();o.classList.add('open');p.classList.add('open')}}
function closeCartPanel(){document.getElementById('cartOverlay').classList.remove('open');document.getElementById('cartPanel').classList.remove('open')}

/* ══════════════════════════════════════════
   تسجيل الطلب
   ══════════════════════════════════════════ */
function goToCheckout(){if(!cart.length)return;closeCartPanel();showScreen('checkout');renderCheckout()}
function renderCheckout(){
  const b=document.getElementById('checkoutBody');const t=getCartTotal();
  b.innerHTML=`<h2>بيانات التوصيل</h2><div class="delivery-toggle"><button class="dt-btn ${deliveryType==='delivery'?'active':''}" onclick="setDT('delivery')">${ic('moto')} توصيل</button><button class="dt-btn ${deliveryType==='pickup'?'active':''}" onclick="setDT('pickup')">${ic('store')} استلام</button></div><div id="deliveryFields"><div class="form-group"><label>الاسم</label><input type="text" id="cName" placeholder="اسمك الكامل"></div><div class="form-group"><label>رقم الجوال</label><input type="tel" id="cPhone" placeholder="05XXXXXXXX" dir="ltr" style="text-align:right"></div>${deliveryType==='delivery'?'<div class="form-group"><label>عنوان التوصيل</label><textarea id="cAddress" placeholder="الحي، الشارع، رقم المبنى"></textarea>':''}<div class="form-group"><label>ملاحظات (اختياري)</label><textarea id="cNotes" placeholder="أي طلبات خاصة"></textarea></div></div><div class="order-summary-box"><div class="osb-title">ملخص الطلب</div>${cart.map(i=>`<div class="osb-item"><span>${i.nameAr} × ${i.qty}</span><span>${i.price*i.qty} ر.س</span></div>`).join('')}<div class="osb-total"><span>المجموع</span><span>${t} ر.س</span></div></div><button class="checkout-btn" onclick="submitOrder()" style="margin-top:1rem">تأكيد الطلب — ${t} ر.س</button>`;
}
function setDT(t){deliveryType=t;renderCheckout()}
function submitOrder(){
  const name=document.getElementById('cName')?.value.trim();const phone=document.getElementById('cPhone')?.value.trim();
  if(!name){showToast('أدخل اسمك','err');return}if(!phone||phone.length<10){showToast('أدخل رقم جوال صحيح','err');return}
  if(deliveryType==='delivery'){const a=document.getElementById('cAddress')?.value.trim();if(!a){showToast('أدخل عنوان التوصيل','err');return}}
  cart=[];updateCartUI();showScreen('success');
}

/* ══════════════════════════════════════════
   توست
   ══════════════════════════════════════════ */
function showToast(msg,type='ok'){
  const c=document.getElementById('toastContainer');const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;c.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},2200);
}

/* ══════════════════════════════════════════
   تعبئة الأيقونات الثابتة + تأثير الإمالة 3D
   ══════════════════════════════════════════ */
document.getElementById('icChevronDown').innerHTML=ic('chevronDown');
document.getElementById('icBackChat').innerHTML=ic('arrowBack');
document.getElementById('icCartChat').insertAdjacentHTML('afterbegin',ic('bag'));
document.getElementById('icSend').innerHTML=ic('arrowSend');
document.getElementById('icBackMenu').innerHTML=ic('arrowBack');
document.getElementById('icCartMenu').insertAdjacentHTML('afterbegin',ic('bag'));
document.getElementById('icBackCheckout').innerHTML=ic('arrowBack');
document.getElementById('icSuccessCheck').innerHTML=ic('check');
document.getElementById('icCartClose').innerHTML=ic('xmark');

const hoverCapable=window.matchMedia('(hover:hover)').matches;
if(hoverCapable){
  function bindTilt(container){
    container.addEventListener('mousemove',e=>{
      const el=e.target.closest('.tilt-3d');
      if(!el||!container.contains(el))return;
      const r=el.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-0.5;
      const y=(e.clientY-r.top)/r.height-0.5;
      el.style.transform=`perspective(700px) rotateY(${x*9}deg) rotateX(${-y*9}deg) translateY(-2px)`;
    });
    container.addEventListener('mouseleave',e=>{
      const el=e.target.closest&&e.target.closest('.tilt-3d');
      container.querySelectorAll('.tilt-3d').forEach(c=>c.style.transform='');
    },true);
  }
  bindTilt(document.getElementById('chatMessages'));
  bindTilt(document.getElementById('menuGrid'));
}

updateCartUI();
</script>
</body>
</html>
